  // artists have put out recently. Manual refresh only, no background
  // polling: you click Refresh, it fetches once, and the results sit in
  // localStorage until you ask again. Uses the same login as playback
  // (now with user-follow-read added to its scope) — no separate connect
  // step for this specifically.
  // =====================================================================

  const RELEASES_CACHE_KEY = "vinyl_shelf_releases_cache";
  let showingReleases = false;
  let releasesCache = loadReleasesCache();
  let releasesMonthsShown = 2;
  let releasesLoading = false;
  let releasesProgress = { checked: 0, total: 0 };
  const releasesToggleEl = document.getElementById("releases-toggle");

  function loadReleasesCache() {
    try {
      const parsed = JSON.parse(localStorage.getItem(RELEASES_CACHE_KEY));
      if (parsed && Array.isArray(parsed.releases)) return parsed;
    } catch {}
    return { fetchedAt: null, releases: [] };
  }

  function saveReleasesCache() {
    localStorage.setItem(RELEASES_CACHE_KEY, JSON.stringify(releasesCache));
  }

  async function fetchAllFollowedArtists(token) {
    let artists = [];
    let after = null;
    for (let guard = 0; guard < 40; guard++) { // safety cap — ~2000 artists, far past any real case
      const url = new URL("https://api.spotify.com/v1/me/following");
      url.searchParams.set("type", "artist");
      url.searchParams.set("limit", "50");
      if (after) url.searchParams.set("after", after);
      const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
      if (!res.ok) throw new Error("Failed to fetch followed artists");
      const data = await res.json();
      const page = data.artists?.items || [];
      artists = artists.concat(page);
      after = data.artists?.cursors?.after;
      if (!after || page.length === 0) break;
    }
    return artists;
  }

  async function fetchOneAlbumsPage(url, token, attempt = 0) {
    // The actual single-request-with-retry logic, unchanged from before —
    // just pulled out so fetchArtistRecentAlbums below can call it once
    // per page instead of once per artist.
    try {
      const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
      if (res.status === 429) {
        // As of a July 2026 Spotify change, a 429 body now includes a
        // "reason" field — "QUOTA_EXCEEDED" for the separate, longer-
        // duration Development Mode quota (retrying within this refresh
        // won't help; it needs real time to reset, likely closer to a
        // day based on direct experience), versus no reason field (or a
        // different one) for the shorter, ~30-second rolling rate limit
        // that retrying-with-backoff genuinely can recover from. Reading
        // this removes the guesswork the retry/circuit-breaker logic
        // below previously had to do blind.
        let reason = null;
        try { reason = (await res.clone().json())?.error?.reason || null; } catch {}
        if (reason === "QUOTA_EXCEEDED") {
          console.warn("New releases: QUOTA_EXCEEDED — this is the daily-style Development Mode quota, not the short rate limit; no amount of retrying within this refresh will help.");
          return { error: "429: Development quota exceeded for today", rateLimited: true, quotaExceeded: true };
        }
        // A single retry with a *capped* wait, not the open-ended,
        // 5-attempt version from an earlier update — that one could
        // compound very badly (up to 5 waits per artist, each as long as
        // Spotify's own Retry-After said, which after all the testing
        // this endpoint has taken could genuinely be many seconds) across
        // dozens of artists, adding up to a multi-minute silent hang.
        // One retry, previously capped at 5s regardless of what the
        // header requested — now allowed up to 20s given there's time
        // budget for it now (a full refresh is expected to take several
        // minutes anyway), so a genuine Retry-After request gets properly
        // respected rather than cut short. If it's still rate limited
        // after that, refreshReleases' circuit breaker takes over rather
        // than this function trying forever.
        if (attempt >= 1) return { error: "429: Too many requests", rateLimited: true };
        const retryAfterHeader = parseInt(res.headers.get("Retry-After"), 10);
        const waitMs = Math.min(isNaN(retryAfterHeader) ? 3 : retryAfterHeader, 20) * 1000 + 300;
        console.warn(`New releases: rate limited, waiting ${waitMs}ms then trying once more`);
        await wait(waitMs);
        return fetchOneAlbumsPage(url, token, attempt + 1);
      }
      if (!res.ok) {
        // Swallowing this into an empty array (the original behavior) made
        // a systematic failure — wrong scope, expired token, rate limit —
        // look identical to "this artist genuinely has nothing recent."
        // Capturing the status *and* Spotify's own error body (it
        // normally returns a JSON {error: {status, message}} explaining
        // exactly what was wrong) means a failure report can include the
        // real reason directly, instead of another round of guessing.
        let detail = "";
        try { detail = (await res.json())?.error?.message || ""; } catch {}
        const message = `${res.status}${detail ? ": " + detail : ""}`;
        console.error(`New releases: albums fetch failed — ${message}`);
        return { error: message };
      }
      return await res.json();
    } catch (err) {
      console.error(`New releases: albums fetch threw`, err);
      return { error: String(err) };
    }
  }

  async function fetchAlbumsOfType(artistId, token, albumType, cutoffStr) {
    // Requesting a single include_groups value at a time, not the combined
    // "album,single" this used to send — confirmed on Spotify's own
    // developer community: combining groups sorts by *type first, then
    // date* (every album newest-to-oldest, then every single
    // newest-to-oldest) rather than one true chronological stream. That's
    // almost certainly why releases were still going missing regardless
    // of artist or type: a recent single could be sitting behind an
    // artist's entire album catalog, since it was never actually
    // competing with those albums on date in the first place. Asking for
    // just one group at a time gets a genuinely sorted, most-recent-first
    // list back (per that same community report — though also a real
    // caveat there that Spotify could change this without notice, which
    // is why the page cap and de-dupe below still apply as a backstop).
    let url = new URL(`https://api.spotify.com/v1/artists/${artistId}/albums`);
    url.searchParams.set("include_groups", albumType);
    const MAX_PAGES = 20; // raised substantially per feedback — this was
                           // never meant to be a coverage limit, just a
                           // defensive backstop against something going
                           // wrong (a malformed response, an infinite
                           // "next" loop). Now that the per-type early
                           // stop below is genuinely reliable, the right
                           // design is "keep paging until actually done,"
                           // not "stop at an arbitrary number" — a small
                           // artist naturally stops after 1 page, a
                           // prolific one keeps going until it reaches
                           // material older than the cutoff, however many
                           // pages that takes. 20 pages of *recent*
                           // material (not their whole career — the
                           // early-stop only lets this run long for an
                           // artist that's *still releasing that much*
                           // within the lookback window) is far beyond
                           // any realistic case; it's a tripwire, not a
                           // ceiling.
    let items = [];
    let confirmedComplete = false; // true once we've actually seen an
                                    // item older than the cutoff (or run
                                    // out of pages) — false if we simply
                                    // hit MAX_PAGES first, which means an
                                    // extremely prolific artist's catalog
                                    // might genuinely still extend past
                                    // what was checked, silently, unless
                                    // this gets surfaced
    for (let page = 0; page < MAX_PAGES && url; page++) {
      const data = await fetchOneAlbumsPage(url, token);
      if (data && data.error) return data; // a real failure — bubble it up as before
      const pageItems = data.items || [];
      items = items.concat(pageItems);
      // Trustworthy now in a way it wasn't for the combined-groups
      // request: since this single-type list is genuinely sorted by
      // date, once a page's oldest item is already past the cutoff,
      // every subsequent page can only be older still.
      const oldestOnPage = pageItems.reduce((min, a) => {
        return (a.release_date && (!min || a.release_date < min)) ? a.release_date : min;
      }, null);
      if (!data.next || pageItems.length === 0 || (oldestOnPage && oldestOnPage < cutoffStr)) {
        confirmedComplete = true;
        break;
      }
      url = data.next;
      await wait(REQUEST_SPACING_MS); // same pacing between pages of the
                                       // same type as between different
                                       // artists — no reason to relax it
                                       // just because it's a follow-up
                                       // page rather than a new artist
    }
    return { items, possiblyIncomplete: !confirmedComplete };
  }

  async function fetchArtistRecentAlbums(artistId, token) {
    const STOP_AFTER_DAYS = 400; // safely past the 12-month ceiling the
                                  // "load more" button can reach
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - STOP_AFTER_DAYS);
    const cutoffStr = cutoff.toISOString().slice(0, 10);

    // Sequential, not Promise.all — keeps true request concurrency at 1
    // across this whole feature, matching every other fetch here, rather
    // than quietly doubling up just for this one artist.
    const albums = await fetchAlbumsOfType(artistId, token, "album", cutoffStr);
    if (albums && albums.error) return albums;
    await wait(REQUEST_SPACING_MS);
    const singles = await fetchAlbumsOfType(artistId, token, "single", cutoffStr);
    if (singles && singles.error) return singles;

    return {
      items: albums.items.concat(singles.items),
      possiblyIncomplete: albums.possiblyIncomplete || singles.possiblyIncomplete,
    };
  }
  const RATE_LIMIT_COOLDOWN_MS = 6 * 60 * 60 * 1000; // 6 hours for an
                                                       // *ambiguous* 429 —
                                                       // not a claim about
                                                       // exactly how long
                                                       // Spotify's rolling
                                                       // rate limit takes
                                                       // to clear, just a
                                                       // floor beneath
                                                       // which retrying is
                                                       // clearly pointless.
  const QUOTA_COOLDOWN_MS = 24 * 60 * 60 * 1000; // 24 hours when Spotify's
                                                   // response explicitly
                                                   // said "QUOTA_EXCEEDED"
                                                   // — this one isn't a
                                                   // floor-beneath-which
                                                   // guess the way the 6h
                                                   // one is; it matches
                                                   // direct, repeated
                                                   // experience of how
                                                   // long the Development
                                                   // Mode quota specifically
                                                   // takes to reset.
  const REQUEST_SPACING_MS = 4000; // shared by every Spotify request this
                                    // feature makes, artist-loop and
                                    // per-type album fetches alike, so the
                                    // pacing discipline that's kept the
                                    // rate limit under control stays
                                    // consistent no matter which part of
                                    // the code is making the request.

  function cooldownDurationFor(cache) {
    return cache.quotaExceeded ? QUOTA_COOLDOWN_MS : RATE_LIMIT_COOLDOWN_MS;
  }

  async function refreshReleases() {
    if (releasesLoading) return;
    if (releasesCache.circuitBroken && releasesCache.fetchedAt) {
      const sinceBreak = Date.now() - releasesCache.fetchedAt;
      if (sinceBreak < cooldownDurationFor(releasesCache)) {
        renderReleasesView(); // shows the cooldown message instead of retrying
        return;
      }
    }
    releasesLoading = true;
    releasesProgress = { checked: 0, total: 0 };
    renderReleasesView(); // show the "checking..." state right away

    try {
      const token = await getUserAccessToken(); // needed for the followed-
                                                  // artists lookup below —
                                                  // that's the one call here
                                                  // that's actually personal
      if (!token) { releasesLoading = false; renderReleasesView(); return; }

      const artists = await fetchAllFollowedArtists(token);
      releasesProgress.total = artists.length;
      // The per-artist albums lookup, on the other hand, is public catalog
      // data — it was never personal and never needed the user login at
      // all, only the follows list above did. Using the app-only token
      // here instead (the same one search already uses successfully)
      // means these 40-plus calls don't share whatever's actually going
      // on with the user-token path specifically — worth trying given
      // search (app-only) keeps working fine while this (user-token) kept
      // 429'ing for over half a day, well past any ordinary rate-limit
      // window, which pointed at something specific to that token/path
      // rather than a ordinary transient rate limit.
      const appToken = await getAccessToken();
      const seen = new Map(); // de-dupe by album id — the same album can
                               // turn up from more than one artist on it
      let failCount = 0;
      let firstFailReason = null; // shown directly in the UI, so a failure
                                   // report needs no console-digging at all
      let consecutiveRateLimits = 0;
      let circuitBroken = false;
      let quotaExceeded = false;
      let incompleteArtistCount = 0; // artists where the page cap was hit
                                      // before confirming we'd actually
                                      // reached old-enough content — see
                                      // fetchAlbumsOfType's
                                      // possiblyIncomplete for the detail
      // Dropped further after a real report: even at 2 concurrent with
      // spacing, adding a second pagination page per artist (see
      // MAX_PAGES above) was enough to trip the rate limit again shortly
      // after it had just recovered from a full day-long block. Now
      // fully sequential (1 at a time) with more room between requests —
      // slower, but this only ever runs on a manual click, and there's
      // no reason to risk another lengthy block to save a minute.
      // Widened further still, explicitly trading speed for a much better
      // shot at not tripping the limit at all — a full refresh now takes
      // several minutes by design, not by accident.
      const CONCURRENCY = 1;
      let cursor = 0;
      async function worker() {
        while (cursor < artists.length && !circuitBroken) {
          const artist = artists[cursor++];
          const result = await fetchArtistRecentAlbums(artist.id, appToken);
          releasesProgress.checked++;
          if (releasesProgress.checked % 3 === 0) renderReleasesView(); // live progress, without repainting on every single result
          if (result && result.error) {
            failCount++;
            if (!firstFailReason) firstFailReason = result.error;
            if (result.quotaExceeded) {
              // Unlike an ordinary 429, this one is unambiguous — Spotify
              // is telling us directly this is the separate, longer-
              // duration Development Mode quota, not the short rolling
              // rate limit. There's no "maybe it clears in a few more
              // requests" here the way there is for a plain 429; direct
              // experience is that this needs closer to a day, not
              // minutes. No point waiting for repeated confirmation the
              // way the consecutive-count check below does — stop right
              // away rather than spending several more minutes (and more
              // of tomorrow's quota) confirming what Spotify already said
              // outright.
              quotaExceeded = true;
              circuitBroken = true;
            } else if (result.rateLimited) {
              consecutiveRateLimits++;
              if (consecutiveRateLimits >= 7) {
                // Retrying individual requests is one thing — a *sustained*
                // rate limit across several different artists in a row means
                // this whole refresh is going to keep hitting the same wall
                // no matter how long we wait between attempts. This is what
                // actually caused the multi-minute hang: retrying every one
                // of 43 artists against a limit that wasn't going to clear
                // within this refresh at all. Stopping here and asking for
                // a fresh click later (once the window's reset) is far
                // more honest than a spinner that never resolves.
                // Raised from 4 to 7 now that requests are spaced much
                // further apart (4s instead of 300ms) — a handful of 429s
                // in a row is less conclusive evidence of a truly sustained
                // block when each one is already minutes into the refresh,
                // so it's worth a few more chances before giving up.
                circuitBroken = true;
              }
            }
          } else {
            consecutiveRateLimits = 0; // only *consecutive* failures trip the breaker
            for (const a of result.items) {
              if (a.release_date && !seen.has(a.id)) seen.set(a.id, a);
            }
            if (result.possiblyIncomplete) incompleteArtistCount++;
          }
          if (cursor < artists.length && !circuitBroken) await wait(REQUEST_SPACING_MS);
        }
      }
      await Promise.all(Array.from({ length: Math.min(CONCURRENCY, artists.length || 1) }, worker));

      const releases = Array.from(seen.values())
        .sort((a, b) => (b.release_date || "").localeCompare(a.release_date || ""));
      releasesCache = {
        fetchedAt: Date.now(), releases, failCount, firstFailReason,
        artistCount: artists.length, checkedCount: releasesProgress.checked, circuitBroken, quotaExceeded,
        incompleteArtistCount,
      };
      saveReleasesCache();
    } catch (err) {
      console.error(err);
    } finally {
      releasesLoading = false;
      renderReleasesView();
    }
  }

  function releasesWithinMonths(months) {
    const cutoff = new Date();
    cutoff.setMonth(cutoff.getMonth() - months);
    const cutoffStr = cutoff.toISOString().slice(0, 10);
    return releasesCache.releases.filter((r) => (r.release_date || "0000-00-00") >= cutoffStr);
  }

  function formatReleaseDate(dateStr) {
    if (!dateStr) return "";
    const d = new Date(dateStr);
    if (isNaN(d)) return dateStr;
    const days = Math.floor((Date.now() - d) / 86400000);
    if (days < 0) return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    if (days === 0) return "today";
    if (days === 1) return "yesterday";
    if (days < 7) return `${days} days ago`;
    if (days < 31) { const w = Math.round(days / 7); return `${w} week${w > 1 ? "s" : ""} ago`; }
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  function formatFullDate(dateStr) {
    // "14 Oct 2026" style; falls back to whatever precision Spotify gave (year, or year-month).
    if (!dateStr) return "";
    if (/^\d{4}$/.test(dateStr)) return dateStr;
    const d = new Date(dateStr.length === 7 ? dateStr + "-01T00:00:00" : dateStr + "T00:00:00");
    if (isNaN(d)) return dateStr;
    return d.toLocaleDateString(undefined, dateStr.length === 7 ? { month: "short", year: "numeric" } : { day: "numeric", month: "short", year: "numeric" });
  }

  function formatRelativeTime(ts) {
    const mins = Math.floor((Date.now() - ts) / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return `${mins} min ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs} hr ago`;
    const days = Math.floor(hrs / 24);
    return `${days} day${days > 1 ? "s" : ""} ago`;
  }

  function formatCooldownRemaining(ms) {
    const totalMins = Math.max(1, Math.ceil(ms / 60000));
    const hrs = Math.floor(totalMins / 60);
    const mins = totalMins % 60;
    if (hrs === 0) return `${mins} min`;
    return `${hrs} hr ${mins} min`;
  }

  function openReleasesView() {
    showingReleases = true;
    releasesMonthsShown = 2;
    searchInput.value = "";
    updateClearButton();
    resultsEl.innerHTML = "";
    resultsEl.classList.remove("fade-hide");
    searchZone.classList.add("active");
    releasesToggleEl.classList.add("active");
    searchInput.blur();
    syncIdleSearchDisplay();
    updateConnectPromptVisibility();
    renderReleasesView();
  }

  function closeReleasesView() {
    if (!showingReleases) return;
    showingReleases = false;
    searchZone.classList.remove("active");
    releasesToggleEl.classList.remove("active");
    resultsEl.innerHTML = "";
    syncIdleSearchDisplay();
    updateConnectPromptVisibility();
  }

  function renderReleasesView(previousVisibleCount = null) {
    if (!showingReleases) return;
    const loggedIn = hasSpotifyLogin();

    if (!loggedIn) {
      resultsEl.innerHTML = `
        <div class="releases-header"><span class="releases-title">New Releases</span></div>
        <p class="status-msg">Connect Spotify to see what your followed artists have released — the same connection playback uses.</p>
        <button type="button" class="releases-refresh-btn" id="releases-connect-btn">Connect Spotify</button>
      `;
      document.getElementById("releases-connect-btn").addEventListener("click", () => beginUserLogin());
      return;
    }

    if (releasesLoading) {
      const progressText = releasesProgress.total
        ? `Checked ${releasesProgress.checked} of ${releasesProgress.total} followed artists…`
        : "Looking up your followed artists…";
      resultsEl.innerHTML = `
        <div class="releases-header"><span class="releases-title">New Releases</span></div>
        <p class="status-msg">${progressText}</p>
      `;
      return;
    }

    if (!releasesCache.fetchedAt) {
      resultsEl.innerHTML = `
        <div class="releases-header"><span class="releases-title">New Releases</span></div>
        <p class="status-msg">Refresh to see what your followed artists have released recently.</p>
        <button type="button" class="releases-refresh-btn" id="releases-refresh-btn">Check for new releases</button>
      `;
      document.getElementById("releases-refresh-btn").addEventListener("click", refreshReleases);
      return;
    }

    const visible = releasesWithinMonths(releasesMonthsShown);
    const cooldownMs = cooldownDurationFor(releasesCache);
    const inCooldown = releasesCache.circuitBroken && releasesCache.fetchedAt
      && (Date.now() - releasesCache.fetchedAt) < cooldownMs;
    const cooldownRemainingMs = inCooldown ? cooldownMs - (Date.now() - releasesCache.fetchedAt) : 0;
    resultsEl.innerHTML = `
      <div class="releases-header">
        <span class="releases-title">New Releases</span>
        <span class="releases-updated">updated ${formatRelativeTime(releasesCache.fetchedAt)}</span>
        <button type="button" class="releases-refresh-btn" id="releases-refresh-btn"${inCooldown ? " disabled" : ""}>${inCooldown ? "Refresh (" + formatCooldownRemaining(cooldownRemainingMs) + ")" : "Refresh"}</button>
      </div>
      ${inCooldown
        ? releasesCache.quotaExceeded
          ? `<p class="status-msg releases-fail-notice">Spotify said outright that today's quota for this app is used up (checked ${releasesCache.checkedCount} of ${releasesCache.artistCount} artists first) — not a guess this time, Spotify's response says so directly. This resets on their end, not something retrying will speed up; Refresh is disabled for ${formatCooldownRemaining(cooldownRemainingMs)} more.</p>`
          : `<p class="status-msg releases-fail-notice">Last attempt got rate-limited after checking only ${releasesCache.checkedCount} of ${releasesCache.artistCount} artists — trying again immediately would likely just fail the same way and use up more of whatever's left of the quota. Refresh is disabled for a while to avoid that; ${formatCooldownRemaining(cooldownRemainingMs)} left.</p>`
        : releasesCache.circuitBroken
          ? `<p class="status-msg releases-fail-notice">Stopped early — Spotify's rate limit kicked in and kept rejecting requests even after backing off (checked ${releasesCache.checkedCount} of ${releasesCache.artistCount} before stopping). Worth trying again now, though if it happens again it may need longer to clear.</p>`
          : releasesCache.failCount
            ? `<p class="status-msg releases-fail-notice">Couldn't check ${releasesCache.failCount} of ${releasesCache.artistCount} followed artists — Spotify said: "${escapeHtml(releasesCache.firstFailReason || "unknown error")}". Results below may be incomplete.</p>`

        ? `<p class="status-msg">${releasesCache.incompleteArtistCount} artist${releasesCache.incompleteArtistCount > 1 ? "s have" : " has"} a catalog deep enough that we stopped checking before confirming we'd reached older material — a genuinely prolific one could theoretically still have something recent past what was checked.</p>`

    `;
    const listWrap = document.createElement("div");
    listWrap.className = "results-list releases-list";
    if (releasesCache.artistCount === 0) {
      // Distinct from "checked everyone, nothing recent" — this is either
      // genuinely not following anyone on Spotify, or the follows lookup
      // itself came back empty for some other reason. Worth telling apart
      // from a quiet, successful "nothing new" result.
      listWrap.innerHTML = `<p class="status-msg">No followed artists found on this Spotify account.</p>`;

  function releaseRowEl(album) {

    // is (a 1-track "single" reads very differently from a 14-track
    // "album", without needing Spotify's own type label at all) — same
    // "N tracks" phrasing already used in search results, just tucked
    // next to the date here rather than its own line.
    const trackLabel = album.total_tracks === 1 ? "1 track" : `${album.total_tracks} tracks`;
    row.innerHTML = `
      <img class="release-thumb" src="${art}" alt="" />
      <div class="release-text">

  const PLAY_ICON = `<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M6 4L20 12L6 20V4Z"/></svg>`;
  const PAUSE_ICON = `<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><rect x="5" y="4" width="5" height="16"/><rect x="14" y="4" width="5" height="16"/></svg>`;

  const MOON_ICON = `<svg viewBox="0 0 24 24" width="22" height="22"><mask id="lamp-moon-mask"><rect width="24" height="24" fill="white"/><circle cx="16.5" cy="8.5" r="7.5" fill="black"/></mask><circle cx="12" cy="12" r="8" fill="currentColor" mask="url(#lamp-moon-mask)"/></svg>`;

  const lampToggleEl = document.getElementById("lamp-toggle");

  function getThemeMode() {

    if (mode === null) {

      // under the old key carries over rather than silently resetting.

  // The same sunrise/sunset formula as the <head> script's inline copy —
  // verified against a real reference (London, a specific date) to the
  // minute before being trusted here. Kept as one function so both the
  // one-off "is it night right now" check and the "when's the next
  // transition" scheduler below share the exact same math.
  function getSunTimes(date, lat, lng) {
    const rad = Math.PI / 180, dayMs = 864e5, J1970 = 2440588, J2000 = 2451545, e = rad * 23.4397;
    const toDays = (dt) => dt.valueOf() / dayMs - 0.5 + J1970 - J2000;
    const solarMeanAnomaly = (d) => rad * (357.5291 + 0.98560028 * d);
    const eclipticLongitude = (M) => M + rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2*M) + 0.0003 * Math.sin(3*M)) + rad * 102.9372 + Math.PI;
    const declination = (l) => Math.asin(Math.sin(l) * Math.sin(e));
    const julianCycle = (d, lw) => Math.round(d - 0.0009 - lw / (2 * Math.PI));
    const approxTransit = (Ht, lw, n) => 0.0009 + (Ht + lw) / (2 * Math.PI) + n;
    const solarTransitJ = (ds, M, L) => J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
    const hourAngle = (h, phi, d) => Math.acos((Math.sin(h) - Math.sin(phi) * Math.sin(d)) / (Math.cos(phi) * Math.cos(d)));
    const toDate = (j) => new Date((j + 0.5 - J1970) * dayMs);

    const lw = rad * -lng, phi = rad * lat, d = toDays(date);
    const n = julianCycle(d, lw), ds = approxTransit(0, lw, n);
    const M = solarMeanAnomaly(ds), L = eclipticLongitude(M), dec = declination(L);
    const Jnoon = solarTransitJ(ds, M, L);
    const w0 = hourAngle(-0.833 * rad, phi, dec);
    const a = approxTransit(w0, lw, n);
    const Jset = solarTransitJ(a, M, L);
    const Jrise = Jnoon - (Jset - Jnoon);
    return { sunrise: toDate(Jrise), sunset: toDate(Jset) };
  }

  function applyMode(isNight, { withTransition = true } = {}) {
    if (!withTransition) {
      // Only used for the very first sync on load — suppresses the 1s
      // fade so restoring a saved (or auto-computed) mode doesn't
      // visibly "re-play" a transition that was never really a change
      // the user watched happen.
      document.documentElement.classList.add("no-transition");
    }
    document.documentElement.classList.toggle("night-mode", isNight);
    syncLampIcon();
    if (!withTransition) {
      requestAnimationFrame(() => requestAnimationFrame(() =>
        document.documentElement.classList.remove("no-transition")));
    }
  }

  function syncLampIcon() {
    // The icon shown is the mode clicking would switch *to* — a moon
    // while in day mode (click for night), a sun while in night mode
    // (click for day) — not the mode you're currently in.
    const isNight = document.documentElement.classList.contains("night-mode");
    lampToggleIconEl.innerHTML = isNight ? SUN_ICON : MOON_ICON;
    lampToggleEl.setAttribute("aria-label", isNight ? "Switch to day mode" : "Switch to night mode");
  }

  function scheduleNextAutoTransition(lat, lng) {
    clearTimeout(autoModeTimer);
    if (getThemeMode() !== "auto") return; // a manual override is in effect — nothing to schedule
    const now = new Date();
    let { sunrise, sunset } = getSunTimes(now, lat, lng);
    // Whichever of today's two transitions hasn't happened yet is next —
    // unless it's already past both (i.e. it's currently night and
    // sunset already passed), in which case the next one is tomorrow's
    // sunrise.
    let next = now < sunrise ? sunrise : now < sunset ? sunset : getSunTimes(new Date(now.getTime() + 86400000), lat, lng).sunrise;
    const msUntil = next.getTime() - now.getTime();
    autoModeTimer = setTimeout(() => {
      applyMode(now < sunrise ? false : now < sunset ? true : false); // sunrise -> day, sunset -> night, next-day sunrise -> day
      scheduleNextAutoTransition(lat, lng); // queue the one after that
    }, Math.max(1000, msUntil));
  }

  function syncAutoModeFromGeo(lat, lng) {
    try { localStorage.setItem(GEO_CACHE_KEY, JSON.stringify({ lat, lng, fetchedAt: Date.now() })); } catch {}
    const { sunrise, sunset } = getSunTimes(new Date(), lat, lng);
    const now = Date.now();
    const isNight = now < sunrise.getTime() || now > sunset.getTime();
    applyMode(isNight, { withTransition: false });
    scheduleNextAutoTransition(lat, lng);
  }

  function initTheme() {
    const mode = getThemeMode();
    if (mode === "day" || mode === "night") {
      // Explicit choice — the <head> script already applied it; just
      // make sure the icon matches (no geolocation involved at all).
      applyMode(mode === "night", { withTransition: false });
      return;
    }
    // Auto mode. The <head> script already made a best-effort guess from
    // any cached location, so the first paint is already reasonable —
    // this fetches a fresh position to confirm/correct it and to know
    // when the *next* transition should happen, without which auto mode
    // could only ever be right at page-load time, never actually switch
    // itself while the page stays open.
    if (!navigator.geolocation) return; // no geolocation available — stays on whatever the <head> guess (or the default day) left it at
    navigator.geolocation.getCurrentPosition(
      (pos) => syncAutoModeFromGeo(pos.coords.latitude, pos.coords.longitude),
      () => {}, // permission denied or unavailable — quietly keep the current guess rather than nag
      { maximumAge: 60 * 60 * 1000, timeout: 10000 }
    );
  }

  lampToggleEl.addEventListener("click", () => {
    // Any manual click sets an explicit preference from here on — the
    // same as this control has always behaved — rather than fighting
    // with auto mode about which one's in charge.
    const isNight = !document.documentElement.classList.contains("night-mode");
    try { localStorage.setItem(THEME_MODE_KEY, isNight ? "night" : "day"); } catch {}
    clearTimeout(autoModeTimer);
    applyMode(isNight);
  });

  syncLampIcon(); // reflects whatever the <head> inline script already applied, so
                   // the icon is correct from the very first paint, not just after a click
  initTheme();

  // ---- Tag filter — top-left icon, mirrors the mode toggle on the right ----

  const filterToggleEl = document.getElementById("filter-toggle");
  const filterPanelEl = document.getElementById("filter-panel");
  const filterListEl = document.getElementById("filter-list");
  const starFilterRowEl = document.getElementById("star-filter-row");

  function updateFilterToggleState() {
    filterToggleEl.classList.toggle("active", activeTagFilters.size > 0);
    const dl = starFilterRowEl.querySelector(".downloaded-filter-btn");
    if (dl) dl.classList.toggle("selected", activeTagFilters.has(DOWNLOADED_KEY));
  }
  updateFilterToggleState();

  function renderStarFilterRow() {
    // Three buttons, one per tier — each one's *own* icon shows that
    // many filled stars (the tier-3 button always reads as ★★★, tier-1
    // always as ★☆☆), purely to label which tier each button is without
    // needing text. That's separate from what selecting one actually
    // does below (an exact match on that tier, not "this many or more").
    const dlSelected = activeTagFilters.has(DOWNLOADED_KEY);
    const dlBtnHtml = `<button type="button" class="downloaded-filter-btn${dlSelected ? " selected" : ""}" title="Show records downloaded in Spotify" aria-label="Show downloaded records"><span class="dl-box">${DL_TICK_SVG}</span></button>`;
    starFilterRowEl.innerHTML = dlBtnHtml + [1, 2, 3].map((tier) => {
      const stars = [1, 2, 3].map((i) => starIconSvg(i <= tier)).join("");
      const selected = activeStarFilters.has(tier);
      return `<button type="button" class="star-filter-btn${selected ? " selected" : ""}" data-tier="${tier}" aria-label="Show only ${tier}-star records">${stars}</button>`;
    }).join("");
  }
  renderStarFilterRow();

  starFilterRowEl.addEventListener("click", (e) => {
    const dlFilterBtn = e.target.closest(".downloaded-filter-btn");
    if (dlFilterBtn) {
      // Same selection rules as any tag pill: plain click is exclusive (click the
      // only selected one again to clear), Cmd/Ctrl-click adds to the selection.
      const key = DOWNLOADED_KEY;
      if (e.metaKey || e.ctrlKey) {
        if (activeTagFilters.has(key)) activeTagFilters.delete(key); else activeTagFilters.add(key);
      } else if (activeTagFilters.size === 1 && activeTagFilters.has(key)) activeTagFilters.clear();
      else { activeTagFilters.clear(); activeTagFilters.add(key); }
      saveActiveFilters();
      updateFilterToggleState();
      filterListEl.querySelectorAll(".filter-tag-btn").forEach((b) => b.classList.toggle("selected", activeTagFilters.has(b.dataset.tag.toLowerCase())));
      currentPage = 0;
      renderShelfWithFade();
      return;
    }
    const btn = e.target.closest(".star-filter-btn");
    if (!btn) return;
    const tier = Number(btn.dataset.tier);

    if (e.metaKey || e.ctrlKey) {
      // Cmd+click: additive multi-select, same convention as the tag
      // filter — e.g. select 2-star and 3-star together to see both.
      if (activeStarFilters.has(tier)) activeStarFilters.delete(tier);
      else activeStarFilters.add(tier);
    } else {
      // Plain click: exclusive single-select — clicking the only
      // currently-selected tier again clears back to "All records."
      if (activeStarFilters.size === 1 && activeStarFilters.has(tier)) activeStarFilters.clear();
      else { activeStarFilters.clear(); activeStarFilters.add(tier); }
    }
    if (activeTagFilters.has(CRATE_KEY) || activeTagFilters.has(SINGLES_KEY)) {
      // (The Singles view is included for the same reason as the Crate: its
      // records have no rating, so a star tier would never match any.)
      // A star tier only ever matches a rated record, and the Crate is by
      // definition only unrated (0-star) ones — combined, that's always
      // an empty view, which used to just look broken ("nothing shows").
      // Selecting a tier now backs out of the Crate first (leaving any
      // other real tag filters selected alongside it untouched) so you
      // land on the normal section showing that tier, instead of an
      // empty page.
      activeTagFilters.delete(CRATE_KEY);
      activeTagFilters.delete(SINGLES_KEY);
      saveActiveFilters();
      updateFilterToggleState();
      filterListEl.querySelectorAll(".crate-btn").forEach((b) => b.classList.remove("selected"));
    }
    saveActiveStarFilters();
    // In-place class toggle, not a full re-render — rebuilding this
    // button's innerHTML from inside its own click handler would detach
    // the clicked element before the click finishes bubbling to
    // document's "click outside closes the panel" listener, which would
    // then see a now-detached e.target, fail the .contains() check, and
    // incorrectly close the panel on every single star-filter click. The
    // tag filter list already solved this same trap the same way.
    starFilterRowEl.querySelectorAll(".star-filter-btn").forEach((b) => {
      b.classList.toggle("selected", activeStarFilters.has(Number(b.dataset.tier)));
    });
    currentPage = 0;
    renderShelfWithFade();
  });

  function tagRecordCount(tag) {
    const key = tag.toLowerCase();
    return shelf.reduce((n, r) => n + ((r.tags || []).some((t) => t.toLowerCase() === key) ? 1 : 0), 0);
  }

  function renderFilterList() {
    // Most-used categories first, so a 30-record tag doesn't get buried
    // below a 3-record one just because it's earlier in the alphabet —
    // ties keep the alphabetical order getAllTags() already gives them,
    // for stable, predictable placement rather than reshuffling on every
    // render when two tags are exactly even.
    const tags = getAllTags()
      .map((tag) => ({ tag, count: tagRecordCount(tag) }))
      .sort((a, b) => b.count - a.count)
      .map((t) => t.tag);
    // The Crate always appears first, even before any real tags exist — it's
    // not a tag anyone created, just the standing view of unrated records, so
    // it has no delete-✕ (you can't delete it) and a dashed border to mark it
    // as conceptually different from a real tag pill beside it.
    const crateSelected = activeTagFilters.has(CRATE_KEY);
    const singlesSelected = activeTagFilters.has(SINGLES_KEY);
    // Singles sits right beside the Crate, same dashed pill (so it shares
    // every "not a real tag" rule — no delete-✕, no rename), told apart by
    // its CD icon.
    const crateHtml = `<li class="filter-tag-item"><button type="button" class="filter-tag-btn crate-btn${crateSelected ? " selected" : ""}" data-tag="${CRATE_KEY}">${CRATE_ICON}<span class="filter-tag-btn-text">Crate</span></button></li>`
      + `<li class="filter-tag-item"><button type="button" class="filter-tag-btn crate-btn singles-btn${singlesSelected ? " selected" : ""}" data-tag="${SINGLES_KEY}">${SINGLES_ICON}<span class="filter-tag-btn-text">Singles</span></button></li>`;
    if (!tags.length) {
      filterListEl.innerHTML = crateHtml + `<li class="tag-empty-hint">No tags yet — add one from a record's card.</li>`;
      return;
    }
    filterListEl.innerHTML = crateHtml + tags.map((tag) => {
      const isSelected = activeTagFilters.has(tag.toLowerCase());
      const isExcluded = excludedTags.has(tag.toLowerCase());
      const classes = ["filter-tag-btn"];
      if (isSelected) classes.push("selected");
      if (isExcluded) classes.push("excluded");
      return `<li class="filter-tag-item"><button type="button" class="${classes.join(" ")}" data-tag="${escapeHtml(tag)}"><span class="filter-tag-btn-text">${escapeHtml(tag)}</span></button><button type="button" class="filter-tag-delete-x" data-tag="${escapeHtml(tag)}" aria-label="Delete ${escapeHtml(tag)}">✕</button></li>`;
    }).join("");
    // No per-button listeners here — see the single delegated listener below,
    // attached once. Rebuilding the list from inside a click handler was
    // orphaning the clicked button before the click event finished bubbling,
    // which (among other things) made the "click outside closes the panel"
    // handler incorrectly think the click had landed outside it.

    filterListEl.querySelectorAll(".filter-tag-btn").forEach((btn) => {
      const overflowAmount = btn.scrollWidth - btn.clientWidth;
      if (overflowAmount > 1) {
        btn.classList.add("overflows");
        btn.style.setProperty("--scroll-distance", `-${overflowAmount + 6}px`);
      }
    });
  }

  filterListEl.addEventListener("click", (e) => {
    if (suppressNextFilterClick) { suppressNextFilterClick = false; return; }

    const deleteX = e.target.closest(".filter-tag-delete-x");
    if (deleteX) {
      // Without stopping propagation here, this same click bubbles up to the
      // document-level "click outside closes the popover" listener below —
      // which sees the X button (correctly) isn't inside the popover, and
      // immediately closes what this line just opened, in the same event.
      e.stopPropagation();
      openTagPopover(deleteX, deleteX.dataset.tag);
      return;
    }

    const btn = e.target.closest(".filter-tag-btn");
    if (!btn) return;

    if (filterListEl.classList.contains("delete-mode")) {
      // Tapping a pill itself (not its X) while in delete-mode just backs
      // out of delete-mode, same as tapping the background on an iOS home
      // screen — it doesn't also select the tag.
      filterListEl.classList.remove("delete-mode");
      return;
    }

    const tag = btn.dataset.tag;
    const key = tag.toLowerCase();

    if (e.altKey) {
      // Option+click: toggle exclusion from the "All records" baseline —
      // independent of selection. In-place class toggle only — panel stays open.
      if (excludedTags.has(key)) excludedTags.delete(key);
      else excludedTags.add(key);
      saveExcludedTags();
      btn.classList.toggle("excluded", excludedTags.has(key));
      if (!activeTagFilters.size) { currentPage = 0; renderShelfWithFade(); }
      return;
    }

    if (e.metaKey || e.ctrlKey) {
      // Cmd+click (Ctrl on Windows/Linux): additive multi-select — toggles
      // this tag in/out of the current selection, leaving others as they are.
      if (activeTagFilters.has(key)) activeTagFilters.delete(key);
      else activeTagFilters.add(key);
    } else {
      // Plain click: exclusive single-select — replaces whatever was
      // selected. Clicking the only currently-selected tag again clears back
      // to "All records."
      if (activeTagFilters.size === 1 && activeTagFilters.has(key)) activeTagFilters.clear();
      else { activeTagFilters.clear(); activeTagFilters.add(key); }
    }
    if ((key === CRATE_KEY || key === SINGLES_KEY) && activeTagFilters.has(key) && activeStarFilters.size) {
      // Mirror image of the star-tier-row fix: a star tier only ever
      // matches a *rated* record, and the Crate is by definition only
      // unrated ones — selecting the Crate while a tier is still active
      // would be the same always-empty contradiction, just approached
      // from the other direction. Selecting the Crate now clears
      // whatever tier was selected.
      activeStarFilters.clear();
      saveActiveStarFilters();
      starFilterRowEl.querySelectorAll(".star-filter-btn").forEach((b) => b.classList.remove("selected"));
    }
    saveActiveFilters();
    updateFilterToggleState();
    // Multi-select can change more than one pill's state at once (e.g. a
    // plain click clears everyone else's "selected" too), so refresh them all.
    filterListEl.querySelectorAll(".filter-tag-btn").forEach((b) => {
      b.classList.toggle("selected", activeTagFilters.has(b.dataset.tag.toLowerCase()));
    });
    currentPage = 0;
    renderShelfWithFade();
  });

  // ---- Long-press (~0.8s) a tag to enter delete mode: every tag
  // shows a small X in its corner; tap one for a confirm step that defaults
  // to *not* deleting. Right-click was tried first but just opened the
  // browser's own context menu instead of ours, so this replaces it. ----

  const tagPopoverEl = document.getElementById("tag-popover");
  const tagPopoverConfirmTextEl = tagPopoverEl.querySelector(".tag-popover-confirm-text");
  const tagPopoverNoBtn = tagPopoverEl.querySelector(".tag-popover-no");
  const tagPopoverYesBtn = tagPopoverEl.querySelector(".tag-popover-yes");
  let popoverTargetTag = null;

  function openTagPopover(anchorEl, tag) {
    popoverTargetTag = tag;
    const rect = anchorEl.getBoundingClientRect();
    tagPopoverEl.style.left = rect.left + "px";
    tagPopoverEl.style.top = (rect.bottom + 6) + "px";
    tagPopoverConfirmTextEl.textContent = `Delete "${tag}"? This removes it from every record that has it.`;
    tagPopoverEl.classList.add("open");
    tagPopoverNoBtn.focus(); // the safe default — rapid Enter/Space presses land here, not on delete
  }
  function closeTagPopover() {
    tagPopoverEl.classList.remove("open");
    popoverTargetTag = null;
  }

  let longPressTimer = null;
  let suppressNextFilterClick = false;

  filterListEl.addEventListener("pointerdown", (e) => {
    const btn = e.target.closest(".filter-tag-btn");
    if (!btn) return;
    clearTimeout(longPressTimer);
    longPressTimer = setTimeout(() => {
      filterListEl.classList.add("delete-mode");
      suppressNextFilterClick = true; // the click that follows this same press shouldn't also toggle selection
    }, 600);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach((type) => {
    filterListEl.addEventListener(type, () => clearTimeout(longPressTimer));
  });

  tagPopoverNoBtn.addEventListener("click", closeTagPopover);
  tagPopoverYesBtn.addEventListener("click", () => {
    if (popoverTargetTag) deleteTagEverywhere(popoverTargetTag);
    closeTagPopover();
    filterListEl.classList.remove("delete-mode");
    renderFilterList(); // this tag no longer exists, or the shelf may be affected
  });
  document.addEventListener("click", (e) => {
    if (!tagPopoverEl.contains(e.target)) closeTagPopover();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (tagPopoverEl.classList.contains("open")) closeTagPopover();
      filterListEl.classList.remove("delete-mode");
    }
  });

  // ---- Right-click a real category to rename it. The long-press delete
  // flow above tried right-click first and abandoned it because it just
  // opened the browser's own menu — but that was for a *replacement* UI, and
  // preventDefault() on "contextmenu" is the standard, reliable way to swap
  // in a custom one, which is exactly what this does. ----

  const tagContextMenuEl = document.getElementById("tag-context-menu");
  const tagContextRenameBtn = document.getElementById("tag-context-rename-btn");
  const tagRenamePopoverEl = document.getElementById("tag-rename-popover");
  const tagRenameInputEl = tagRenamePopoverEl.querySelector(".tag-rename-input");
  const tagRenameCancelBtn = tagRenamePopoverEl.querySelector(".tag-rename-cancel");
  const tagRenameSaveBtn = tagRenamePopoverEl.querySelector(".tag-rename-save");
  let contextMenuTargetTag = null;
  let renameTargetTag = null;

  function openTagContextMenu(x, y, tag) {
    contextMenuTargetTag = tag;
    tagContextMenuEl.style.left = x + "px";
    tagContextMenuEl.style.top = y + "px";
    tagContextMenuEl.classList.add("open");
  }
  function closeTagContextMenu() {
    tagContextMenuEl.classList.remove("open");
    contextMenuTargetTag = null;
  }
  function openTagRenamePopover(x, y, tag) {
    renameTargetTag = tag;
    tagRenamePopoverEl.style.left = x + "px";
    tagRenamePopoverEl.style.top = y + "px";
    tagRenameInputEl.value = tag;
    tagRenamePopoverEl.classList.add("open");
    tagRenameInputEl.focus();
    tagRenameInputEl.select();
  }
  function closeTagRenamePopover() {
    tagRenamePopoverEl.classList.remove("open");
    renameTargetTag = null;
  }
  function submitTagRename() {
    if (!renameTargetTag) return;
    const newName = tagRenameInputEl.value.trim();
    if (newName) renameTagEverywhere(renameTargetTag, newName);
    closeTagRenamePopover();
  }

  filterListEl.addEventListener("contextmenu", (e) => {
    const btn = e.target.closest(".filter-tag-btn");
    if (!btn || btn.classList.contains("crate-btn")) return; // the Crate isn't a real tag — nothing to rename
    e.preventDefault();
    filterListEl.classList.remove("delete-mode");
    openTagContextMenu(e.clientX, e.clientY, btn.dataset.tag);
  });
  tagContextRenameBtn.addEventListener("click", (e) => {
    // Without this, the same click bubbles up to the document-level
    // "click outside closes the rename popover" listener below, which
    // would see this button (correctly) isn't inside the popover we're
    // about to open and close it in the very same event — the exact trap
    // documented elsewhere in this file for the delete-✕ popover.
    e.stopPropagation();
    const tag = contextMenuTargetTag;
    const x = parseFloat(tagContextMenuEl.style.left);
    const y = parseFloat(tagContextMenuEl.style.top);
    closeTagContextMenu();
    if (tag) openTagRenamePopover(x, y, tag);
  });
  tagRenameCancelBtn.addEventListener("click", closeTagRenamePopover);
  tagRenameSaveBtn.addEventListener("click", submitTagRename);
  tagRenameInputEl.addEventListener("keydown", (e) => {
    e.stopPropagation(); // don't let Escape here also fall through to other global handlers below
    if (e.key === "Enter") { e.preventDefault(); submitTagRename(); }
    else if (e.key === "Escape") { e.preventDefault(); closeTagRenamePopover(); }
  });
  document.addEventListener("click", (e) => {
    if (!tagContextMenuEl.contains(e.target)) closeTagContextMenu();
    if (!tagRenamePopoverEl.contains(e.target)) closeTagRenamePopover();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      closeTagContextMenu();
      closeTagRenamePopover();
    }
  });

  // ---- "This will be moved to your Crate" confirm — shown when clearing
  // a record's rating back to 0 stars, since that's exactly what sends it
  // to the Crate. ----

  const moveToCratePopoverEl = document.getElementById("move-to-crate-popover");
  const moveToCrateNoBtn = document.getElementById("move-to-crate-no");
  const moveToCrateYesBtn = document.getElementById("move-to-crate-yes");
  let moveToCrateConfirmCallback = null;

  function openMoveToCratePopover(anchorEl, onConfirm) {
    const rect = anchorEl.getBoundingClientRect();
    moveToCratePopoverEl.style.left = rect.left + "px";
    moveToCratePopoverEl.style.top = (rect.bottom + 6) + "px";
    moveToCrateConfirmCallback = onConfirm;
    moveToCratePopoverEl.classList.add("open");
    moveToCrateNoBtn.focus(); // same safe-default convention as the delete-tag popover
  }
  function closeMoveToCratePopover() {
    moveToCratePopoverEl.classList.remove("open");
    moveToCrateConfirmCallback = null;
  }
  moveToCrateNoBtn.addEventListener("click", closeMoveToCratePopover);
  moveToCrateYesBtn.addEventListener("click", () => {
    const cb = moveToCrateConfirmCallback;
    closeMoveToCratePopover();
    if (cb) cb();
  });
  document.addEventListener("click", (e) => {
    if (!moveToCratePopoverEl.contains(e.target)) closeMoveToCratePopover();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeMoveToCratePopover();
  });

  // ---- Rating a Crate (0-star) record requires picking at least one
  // category first. This modal is what actually applies the rating and the
  // chosen categories together, only once "Add to collection" is
  // confirmed — nothing is saved if it's cancelled. ----

  const cratePromoteOverlayEl = document.getElementById("crate-promote-overlay");
  const cratePromoteCoverEl = document.getElementById("crate-promote-cover");
  const cratePromoteTitleEl = document.getElementById("crate-promote-title");
  const cratePromoteTagListEl = document.getElementById("crate-promote-tag-list");
  const cratePromoteNewInput = document.getElementById("crate-promote-new-input");
  const cratePromoteNewBtn = document.getElementById("crate-promote-new-btn");
  const cratePromoteCancelBtn = document.getElementById("crate-promote-cancel-btn");
  const cratePromoteConfirmBtn = document.getElementById("crate-promote-confirm-btn");

  let cratePromoteRecord = null;
  let cratePromoteNewStars = null;
  let cratePromoteStarRatingEl = null;
  let cratePromotePendingTags = new Set(); // lowercased keys currently checked
  let cratePromotePendingTagNames = new Map(); // lowercased key -> display-cased name

  function renderCratePromoteTagList() {
    // Plain buttons rather than the per-record tag panel's
    // label+checkbox combo — that pattern depends on preventDefault()
    // during pointerdown suppressing the browser's native label→checkbox
    // click-forwarding, which turns out not to actually happen (confirmed
    // directly: the forwarded click re-toggles the checkbox right back,
    // fighting the JS state a moment later). A plain button, toggled on
    // its own "click" with no native forwarding involved, is the same
    // reliable approach already used for the filter-tag and star-filter
    // pills elsewhere in this file.
    const tags = getAllTags();
    cratePromoteTagListEl.innerHTML = tags.length
      ? tags.map((tag) => {
          const isActive = cratePromotePendingTags.has(tag.toLowerCase());
          return `<li><button type="button" class="tag-pill${isActive ? " active" : ""}" data-tag="${escapeHtml(tag)}"><span class="tag-pill-text">${escapeHtml(tag)}</span></button></li>`;
        }).join("")
      : `<li class="tag-empty-hint">No categories yet — create one below.</li>`;
    cratePromoteConfirmBtn.disabled = cratePromotePendingTags.size === 0;
  }

  function openCratePromoteModal(record, newStars, starRatingEl) {
    cratePromoteRecord = record;
    cratePromoteNewStars = newStars;
    cratePromoteStarRatingEl = starRatingEl;
    cratePromotePendingTags = new Set((record.tags || []).map((t) => t.toLowerCase()));
    cratePromotePendingTagNames = new Map((record.tags || []).map((t) => [t.toLowerCase(), t]));
    cratePromoteCoverEl.src = resolveArt(record.art) || "";
    cratePromoteTitleEl.textContent = `Add "${record.name}" to your collection`;
    cratePromoteNewInput.value = "";
    renderCratePromoteTagList();
    cratePromoteOverlayEl.classList.add("open");
  }
  function closeCratePromoteModal() {
    cratePromoteOverlayEl.classList.remove("open");
    cratePromoteRecord = null;
    cratePromoteNewStars = null;
    cratePromoteStarRatingEl = null;
    cratePromotePendingTags = new Set();
    cratePromotePendingTagNames = new Map();
  }

  cratePromoteTagListEl.addEventListener("click", (e) => {
    // Plain button + click — no native label→checkbox forwarding to fight,
    // unlike the per-record tag panel's label+checkbox pills.
    const btn = e.target.closest(".tag-pill");
    if (!btn) return;
    const tag = btn.dataset.tag;
    const key = tag.toLowerCase();
    const nowActive = !btn.classList.contains("active");
    if (nowActive) { cratePromotePendingTags.add(key); cratePromotePendingTagNames.set(key, tag); }
    else cratePromotePendingTags.delete(key);
    btn.classList.toggle("active", nowActive);
    cratePromoteConfirmBtn.disabled = cratePromotePendingTags.size === 0;
  });

  const submitCratePromoteNewTag = () => {
    const name = cratePromoteNewInput.value.trim();
    if (!name) return;
    if (isReservedTagName(name)) { cratePromoteNewInput.value = ""; return; } // reserved, same rule as everywhere else
    registerTagName(name); // makes it a real, selectable category from now on
    cratePromotePendingTags.add(name.toLowerCase());
    cratePromotePendingTagNames.set(name.toLowerCase(), name);
    cratePromoteNewInput.value = "";
    renderCratePromoteTagList();
  };
  cratePromoteNewBtn.addEventListener("click", submitCratePromoteNewTag);
  cratePromoteNewInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); submitCratePromoteNewTag(); }
    else if (e.key === "Escape") { e.preventDefault(); closeCratePromoteModal(); }
  });

  cratePromoteCancelBtn.addEventListener("click", closeCratePromoteModal);
  cratePromoteOverlayEl.addEventListener("click", (e) => {
    if (e.target === cratePromoteOverlayEl) closeCratePromoteModal(); // backdrop click = cancel
  });
  cratePromoteConfirmBtn.addEventListener("click", () => {
    if (!cratePromoteRecord || cratePromotePendingTags.size === 0) return;
    const record = cratePromoteRecord;
    const newStars = cratePromoteNewStars;
    const starRatingEl = cratePromoteStarRatingEl;
    record.tags = Array.from(cratePromotePendingTags).map((key) => cratePromotePendingTagNames.get(key) || key);
    record.stars = newStars;
    saveShelf();
    markDirty();
    closeCratePromoteModal();
    if (getVisibleShelf().includes(record)) {
      if (starRatingEl) starRatingEl.innerHTML = starRatingHtml(record.stars);
    } else {
      // The whole point of this flow — it just gained both a rating and at
      // least one category, which always takes it out of the Crate.
      renderShelf();
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && cratePromoteOverlayEl.classList.contains("open")) closeCratePromoteModal();
  });

  function openFilterPanel() {
    renderFilterList();
    filterPanelEl.classList.add("open");
    filterToggleEl.classList.add("menu-open");
    starFilterRowEl.classList.add("open");
  }
  function closeFilterPanel() {
    filterPanelEl.classList.remove("open");
    filterToggleEl.classList.remove("menu-open");
    filterListEl.classList.remove("delete-mode");
    starFilterRowEl.classList.remove("open");
  }

  filterToggleEl.addEventListener("click", (e) => {
    e.stopPropagation();
    if (filterPanelEl.classList.contains("open")) closeFilterPanel();
    else openFilterPanel();
  });
  document.addEventListener("click", (e) => {
    if (!filterPanelEl.contains(e.target) && e.target !== filterToggleEl && !tagPopoverEl.contains(e.target) && !starFilterRowEl.contains(e.target)) closeFilterPanel();
  });

  function syncIdleSearchDisplay() {
    // Only touches the idle/resting display — the loading-spin animation in
    // runSearch() manages the input's fade itself during that brief window.
    const inActiveSearch = searchZone.classList.contains("active");
    const shouldShowControls = showingPlayback && !inActiveSearch && !showingReleases;
    playbackControlsEl.classList.toggle("visible", shouldShowControls);
    // The input hides both when playback controls are showing (as before)
    // and while the releases feed has taken over this same area — it isn't
    // relevant to either of those, so there's nothing to type into.
    searchInputWrap.classList.toggle("hidden-fade", shouldShowControls || showingReleases);

    // Always visible except mid-results/preview or the releases feed
    // (Escape/back already cover leaving those) — reachable from the very
    // first launch, not gated behind having played something.
    const showToggle = !inActiveSearch && !showingReleases;
    modeToggleEl.classList.toggle("hidden", !showToggle);
    if (showToggle) {
      const showWaveform = !showingPlayback; // currently on search — clicking goes to playback
      modeToggleEl.innerHTML = showWaveform ? WAVEFORM_ICON : MAGNIFY_ICON;
      modeToggleEl.setAttribute("aria-label", showWaveform ? "Switch to playback controls" : "Search for a record");
    }
  }

  // ---- Unsaved-changes indicator — a quiet reminder of whether the shelf's
  // actual content (records, tags — not view state like zoom or which filter
  // is selected) has changed since the last export. ----

  const SAVE_ICON_CLEAN = `<svg viewBox="0 0 24 24" fill="var(--brass)"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5" stroke="var(--wall)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const SAVE_ICON_DIRTY = `<svg viewBox="0 0 24 24" fill="none" stroke="var(--text-on-wall)" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  const saveIndicatorEl = document.getElementById("save-indicator");

  function loadDirtyFlag() { return localStorage.getItem("vinyl_shelf_dirty") === "1"; }
  function saveDirtyFlag(dirty) { localStorage.setItem("vinyl_shelf_dirty", dirty ? "1" : "0"); }
  let isDirty = loadDirtyFlag();

  function updateSaveIndicator() {
    saveIndicatorEl.innerHTML = isDirty ? SAVE_ICON_DIRTY : SAVE_ICON_CLEAN;
    saveIndicatorEl.setAttribute("aria-label", isDirty ? "Unsaved changes since last backup" : "Backup up to date");
  }
  function markDirty() {
    if (isDirty) return;
    isDirty = true;
    saveDirtyFlag(true);
    updateSaveIndicator();
  }
  function markClean() {
    isDirty = false;
    saveDirtyFlag(false);
    updateSaveIndicator();
  }
  updateSaveIndicator();

  // ---- Backup / restore — the shelf lives in this browser's localStorage,
  // which is per-browser and per-device (Brave and Chrome never share it),
  // and can occasionally be cleared by the browser itself (clearing site
  // data/cache usually takes it too). This is the actual reliable safety
  // net: a real file you control, independent of any browser's storage. ----

  const BACKUP_KEYS = [
    "vinyl_shelf_records",
    "vinyl_shelf_all_tags",
    "vinyl_shelf_active_filters",
    "vinyl_shelf_excluded_tags",
    "vinyl_shelf_zoom",
  ];

  const backupToggleEl = document.getElementById("backup-toggle");
  const backupPanelEl = document.getElementById("backup-panel");
  const backupStatusEl = document.getElementById("backup-status");
  const backupExportBtn = document.getElementById("backup-export-btn");
  const backupImportBtn = document.getElementById("backup-import-btn");
  const backupFileInput = document.getElementById("backup-file-input");
  const backupConfirmEl = document.getElementById("backup-confirm");
  const backupConfirmCountEl = document.getElementById("backup-confirm-count");
  const backupConfirmDateEl = document.getElementById("backup-confirm-date");
  const backupConfirmNoBtn = document.getElementById("backup-confirm-no");
  const backupConfirmYesBtn = document.getElementById("backup-confirm-yes");
  let pendingImportPayload = null;

  function openBackupPanel() { backupPanelEl.classList.add("open"); }
  function closeBackupPanel() { backupPanelEl.classList.remove("open"); }
  backupToggleEl.addEventListener("click", (e) => {
    e.stopPropagation();
    backupStatusEl.textContent = "";
    if (backupPanelEl.classList.contains("open")) closeBackupPanel();
    else openBackupPanel();
  });
  document.addEventListener("click", (e) => {
    if (!backupPanelEl.contains(e.target) && e.target !== backupToggleEl) closeBackupPanel();
  });

  function formatBackupFilenameTimestamp(d) {
    // Date plus time, per feedback — multiple same-day backups used to be
    // indistinguishable by filename alone. Colons aren't safe in
    // filenames (invalid on Windows), so this uses HHMM rather than the
    // ISO string's own HH:MM:SS.
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;
  }

  function exportBackup() {
    const data = {};
    BACKUP_KEYS.forEach((key) => {
      const val = localStorage.getItem(key);
      if (val !== null) data[key] = val; // raw strings, exactly as localStorage holds them
    });
    const payload = {
      app: "lp-album-player", // (backups made before the rename say "vinyl-shelf" and are still accepted)
      exportVersion: 1,
      exportedAt: new Date().toISOString(),
      data,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `lp-album-player-backup-${formatBackupFilenameTimestamp(new Date())}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    backupStatusEl.textContent = "Backup saved ✓";
    markClean();
  }
  backupExportBtn.addEventListener("click", (e) => { e.stopPropagation(); exportBackup(); });

  backupImportBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    backupFileInput.value = ""; // so re-selecting the same file still fires "change"
    backupFileInput.click();
  });

  function formatBackupDateTime(isoString) {
    if (!isoString) return "Unknown date";
    const d = new Date(isoString);
    if (isNaN(d)) return "Unknown date";
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    let hours = d.getHours();
    const minutes = String(d.getMinutes()).padStart(2, "0");
    const ampm = hours >= 12 ? "pm" : "am";
    hours = hours % 12 || 12;
    return `${y}-${m}-${day} @ ${hours}:${minutes}${ampm}`;
  }

  backupFileInput.addEventListener("change", () => {
    const file = backupFileInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let payload;
      try {
        payload = JSON.parse(reader.result);
      } catch {
        backupStatusEl.textContent = "That file isn't valid JSON.";
        return;
      }
      if (!payload || (payload.app !== "lp-album-player" && payload.app !== "vinyl-shelf") || !payload.data) {
        backupStatusEl.textContent = "Doesn't look like an LP: Album Player backup file.";
        return;
      }
      pendingImportPayload = payload;
      let recordCount = 0;
      try { recordCount = JSON.parse(payload.data.vinyl_shelf_records || "[]").length; } catch {}
      backupConfirmCountEl.textContent = `${recordCount} record${recordCount === 1 ? "" : "s"}`;
      backupConfirmDateEl.textContent = formatBackupDateTime(payload.exportedAt);
      closeBackupPanel();
      backupConfirmEl.classList.add("open");
      backupConfirmNoBtn.focus(); // safe default
    };
    reader.readAsText(file);
  });

  backupConfirmNoBtn.addEventListener("click", () => {
    backupConfirmEl.classList.remove("open");
    pendingImportPayload = null;
  });
  backupConfirmYesBtn.addEventListener("click", () => {
    if (!pendingImportPayload) return;
    BACKUP_KEYS.forEach((key) => localStorage.removeItem(key)); // clear first, so a backup missing a key (e.g. no filters) doesn't leave stale old ones behind
    Object.entries(pendingImportPayload.data).forEach(([key, val]) => {
      if (BACKUP_KEYS.includes(key)) localStorage.setItem(key, val);
    });
    saveDirtyFlag(false); // just synced to a known file — clean by definition
    location.reload();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && backupConfirmEl.classList.contains("open")) {
      backupConfirmEl.classList.remove("open");
      pendingImportPayload = null;
    }
  });

  async function bootstrapSpotifyAuth() {
    await handleOAuthRedirectIfPresent();
    updateConnectPromptVisibility();
    syncIdleSearchDisplay();
    if (window.Spotify && hasSpotifyLogin() && !spotifyPlayer) {
      initSpotifyPlayerIfLoggedIn(); // safety net in case the SDK's own ready event fired first
    }
  }
  bootstrapSpotifyAuth();

  function trackRowHtml(t, index) {
    return `<li data-uri="${t.uri || ""}"><span class="track-main"><span class="track-number">${index + 1}.</span><span class="track-name">${escapeHtml(t.name)}</span></span><span class="track-time">${t.duration}</span></li>`;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

</script>
<script>
  // Installable + works offline: the service worker keeps a copy of the app.
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
  }
</script>
<script src="https://sdk.scdn.co/spotify-player.js"></script>
</body>
</html>
