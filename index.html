  // Singles feature that has exactly one track and has never been classified
  // is filed straight into Singles (not the Crate: it was already on the
  // shelf, so it's already been kept). Its rating/tags are left in the data
  // but never shown for a single. Records with an explicit isSingle value
  // (from this version on) are never touched.
  (function migrateLegacySingles() {
    let touched = false;
    shelf.forEach((r) => {
      if (r.isSingle === undefined && Number(r.tracks) === 1) {
        r.isSingle = true;
        r.inSingles = true;
        touched = true;
      }
    });
    if (touched) saveShelf();
  })();

  const zoomSlider = document.getElementById("zoom-slider");
  const pagePrevBtn = document.getElementById("page-prev");
  const pageNextBtn = document.getElementById("page-next");
  let currentPage = 0;
  zoomSlider.value = zoom;
  let zoomReflowScheduled = false;
  zoomSlider.addEventListener("input", (e) => {
    applyZoom(parseFloat(e.target.value)); // instant resize feedback on whatever's currently rendered
    if (!zoomReflowScheduled) {
      zoomReflowScheduled = true;
      requestAnimationFrame(() => {
        renderShelf(); // re-paginate at the next paint — records from the next page fill in
                        // freed-up space as soon as there's actually room, not after a fixed delay
        zoomReflowScheduled = false;
      });
    }
  });
  zoomSlider.addEventListener("change", () => renderShelf());

  renderShelf();

  searchInput.addEventListener("keydown", async (e) => {
    if (e.key !== "Enter") return;
    const query = searchInput.value.trim();
    if (!query) return;
    const linkedAlbumId = extractSpotifyAlbumId(query);
    const linkedTrackId = linkedAlbumId ? null : extractSpotifyTrackId(query);
    if (linkedTrackId) {
      await fetchTrackByIdAndPreview(linkedTrackId);
    } else if (linkedAlbumId) {
      await fetchAlbumByIdAndPreview(linkedAlbumId);
    } else {
      await runSearch(query);
    }
  });

  searchInput.addEventListener("input", updateClearButton);

  clearBtn.addEventListener("click", () => clearSearch());

  function clearSearch(refocus = true) {
    searchInput.value = "";
    resultsEl.innerHTML = "";
    updateClearButton();
    searchZone.classList.remove("active");
    showingPlayback = !!currentTrackName; // rest on playback controls if there's something to show, otherwise stay put on search
    syncIdleSearchDisplay();
    if (refocus && !showingPlayback) searchInput.focus(); else searchInput.blur();
  }

  function updateClearButton() {
    clearBtn.classList.toggle("visible", searchInput.value.trim().length > 0);
  }

  function wait(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
  }

  // ---- Global keyboard shortcuts ----
  document.addEventListener("keydown", (e) => {
    if (e.key === " ") {
      if (document.activeElement === searchInput) return; // typing — the only exception
      e.preventDefault();
      if (spotifyPlayer) { pulseButton("play-pause-btn"); spotifyPlayer.togglePlay(); }
      return;
    }
    if (isOffline && (e.key === "Enter" || e.key === "Tab")) return; // search and the playback panel aren't there offline
    if (e.key === "Enter" && document.activeElement === document.body) {
      // Nothing else is focused — Enter jumps into the search bar (space is
      // reserved for play/pause everywhere now, so this is search's way in).
      e.preventDefault();
      if (showingReleases) closeReleasesView();
      showingPlayback = false;
      syncIdleSearchDisplay();
      searchInput.focus();
      return;
    }
    if (e.key === "Tab") {
      // Tab's only job here: toggle between search and playback controls, in
      // one tap, from anywhere — same as the corner icon, and always available
      // (not just once something's actually played).
      e.preventDefault();
      modeToggleEl.click();
      return;
    }
    if (e.key === "Escape") {
      if (showingReleases) { closeReleasesView(); return; }
      clearSearch(false);
      return;
    }
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      // Only treat these as shelf paging when focus isn't inside the search UI,
      // and not on the zoom slider (which uses arrow keys natively itself).
      if (!searchZone.contains(document.activeElement) && document.activeElement !== zoomSlider) {
        e.preventDefault();
        changePage(e.key === "ArrowLeft" ? "prev" : "next");
      }
    }
  });

  function focusResultRow(index) {
    const rows = resultsEl.querySelectorAll(".result-row");
    if (!rows.length) return;
    const clamped = Math.max(0, Math.min(rows.length - 1, index));
    rows[clamped].focus();
  }

  function extractSpotifyAlbumId(text) {
    // Recognizes both forms Spotify's own "Share" menu produces: a full
    // open.spotify.com link (optionally with an "intl-xx/" locale prefix,
    // and optionally with a "?si=..." tracking param after it, both of
    // which "Copy link" can include) and the shorter spotify:album:ID
    // URI form from "Copy Spotify URI". Either one, pasted whole, is
    // enough to identify the exact album — no search or ranking involved.
    const urlMatch = text.match(/open\.spotify\.com\/(?:intl-[a-z-]+\/)?album\/([a-zA-Z0-9]+)/);
    if (urlMatch) return urlMatch[1];
    const uriMatch = text.match(/spotify:album:([a-zA-Z0-9]+)/);
    if (uriMatch) return uriMatch[1];
    return null;
  }

  function extractSpotifyTrackId(text) {
    // Same two share forms as albums: the "Copy song link" URL (optional
    // locale prefix and ?si= tracking) or the spotify:track:ID URI.
    const urlMatch = text.match(/open\.spotify\.com\/(?:intl-[a-z-]+\/)?track\/([a-zA-Z0-9]+)/);
    if (urlMatch) return urlMatch[1];
    const uriMatch = text.match(/spotify:track:([a-zA-Z0-9]+)/);
    if (uriMatch) return uriMatch[1];
    return null;
  }

  async function fetchTrackByIdAndPreview(trackId) {
    // A pasted song link becomes a one-track "album-shaped" object, so the
    // existing preview / Add / record-building path handles it unchanged.
    // Its id is the track's own id (never the parent album's), so adding one
    // song from an album doesn't collide with owning the album itself.
    searchInputWrap.classList.add("hidden-fade");
    resultsEl.classList.add("fade-hide");
    await wait(250);
    vinylSpinner.classList.remove("spinning");
    void vinylSpinner.offsetWidth;
    vinylSpinner.classList.add("spinning");

    const fetchPromise = (async () => {
      const token = await getAccessToken();
      const res = await fetch(`https://api.spotify.com/v1/tracks/${trackId}`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      if (!res.ok) throw new Error("Track lookup failed");
      return res.json();
    })();
    const minSpin = wait(1200);
    let track = null, failed = false;
    try { [track] = await Promise.all([fetchPromise, minSpin]); }
    catch (err) { console.error(err); failed = true; await minSpin; }

    vinylSpinner.classList.remove("spinning");
    searchInputWrap.classList.remove("hidden-fade");
    searchZone.classList.add("active");

    if (failed || !track || !track.id) {
      resultsEl.innerHTML = `<p class="status-msg">Couldn't find that song — double check the link was copied correctly.</p>`;
      resultsEl.classList.remove("fade-hide");
      updateClearButton();
      return;
    }
    const item = {
      durationMs: track.duration_ms || 0,
      id: track.id,
      name: track.name,
      artists: track.artists || [],
      images: track.album?.images || [],
      external_urls: track.external_urls || { spotify: `https://open.spotify.com/track/${track.id}` },
      release_date: track.album?.release_date || "",
      total_tracks: 1,
      trackUri: track.uri || `spotify:track:${track.id}`,
    };
    lastResults = [item];
    resultsEl.classList.remove("fade-hide");
    showPreview(item, 0);
  }

  async function fetchAlbumByIdAndPreview(albumId) {
    // Mirrors runSearch's own loading choreography (fade, spin for at
    // least one full turn, fade back in) so a pasted-link lookup feels
    // like the same kind of action as a normal search, not a different
    // mechanism bolted on the side.
    searchInputWrap.classList.add("hidden-fade");
    resultsEl.classList.add("fade-hide");
    await wait(250);

    vinylSpinner.classList.remove("spinning");
    void vinylSpinner.offsetWidth;
    vinylSpinner.classList.add("spinning");

    const fetchPromise = (async () => {
      const token = await getAccessToken();
      const res = await fetch(`https://api.spotify.com/v1/albums/${albumId}`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      if (!res.ok) throw new Error("Album lookup failed");
      return res.json();
    })();
    const minSpin = wait(1200);

    let album = null;
    let failed = false;
    try {
      [album] = await Promise.all([fetchPromise, minSpin]);
    } catch (err) {
      console.error(err);
      failed = true;
      await minSpin;
    }

    vinylSpinner.classList.remove("spinning");
    searchInputWrap.classList.remove("hidden-fade");
    searchZone.classList.add("active");

    if (failed || !album || !album.id) {
      resultsEl.innerHTML = `<p class="status-msg">Couldn't find that album — double check the link was copied correctly.</p>`;
      resultsEl.classList.remove("fade-hide");
      updateClearButton();
      return;
    }

    // A direct hit skips the results list entirely and goes straight to
    // the same preview a normal search result click would show — the
    // whole point is bypassing ranking, not just improving it. Still set
    // as a one-item lastResults so "‹ back to results" has something
    // sensible to return to rather than needing a special case.
    lastResults = [album];
    resultsEl.classList.remove("fade-hide");
    showPreview(album, 0);
  }

  async function runSearch(query) {
    // Fade the search text out, spin the record while we wait, then fade
    // the input and results back in together — a deliberate, unhurried beat
    // rather than an instant swap.
    searchInputWrap.classList.add("hidden-fade");
    resultsEl.classList.add("fade-hide");
    await wait(250);

    vinylSpinner.classList.remove("spinning");
    void vinylSpinner.offsetWidth; // force a reflow so the animation truly restarts from 0deg every time
    vinylSpinner.classList.add("spinning");

    const fetchPromise = (async () => {
      const token = await getAccessToken();
      const res = await fetch(
        `https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=album&limit=10`,
        { headers: { Authorization: `Bearer ${token}` } }
      );
      if (!res.ok) throw new Error("Search failed");
      return res.json();
    })();
    const minSpin = wait(1200); // let the record complete at least one full turn

    let data = null;
    let failed = false;
    try {
      [data] = await Promise.all([fetchPromise, minSpin]);
    } catch (err) {
      console.error(err);
      failed = true;
      await minSpin;
    }

    vinylSpinner.classList.remove("spinning");
    searchInputWrap.classList.remove("hidden-fade");
    searchZone.classList.add("active"); // raised only while results/preview are showing

    if (failed) {
      resultsEl.innerHTML = `<p class="status-msg">Couldn't search — check your Client ID/Secret in the file, or your connection.</p>`;
    } else {
      lastResults = data.albums.items;
      renderResults(lastResults);
    }
    resultsEl.classList.remove("fade-hide");
    updateClearButton();
  }

  function renderResults(albums, focusIndex = 0) {
    if (!albums.length) {
      resultsEl.innerHTML = `<p class="status-msg">No matches. Try a different search.</p>`;
      return;
    }
    resultsEl.innerHTML = `<div class="results-list" id="results-list"></div>`;
    const listEl = document.getElementById("results-list");
    albums.forEach((album, index) => {
      const row = document.createElement("div");
      row.className = "result-row";
      row.tabIndex = 0;
      const trackLabel = album.total_tracks === 1 ? "1 track" : `${album.total_tracks} tracks`;
      row.innerHTML = `<span class="artist">${escapeHtml(album.artists.map(a=>a.name).join(", "))}</span> — ${escapeHtml(album.name)} <span class="track-count">(${trackLabel})</span>${isOnShelf(album.id) ? OWNED_BADGE : ""}`;
      row.addEventListener("click", () => showPreview(album, index));
      row.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === "ArrowRight") {
          e.preventDefault();
          showPreview(album, index);
        } else if (e.key === "ArrowDown") {
          e.preventDefault();
          focusResultRow(index + 1);
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          focusResultRow(index - 1);
        }
        // Escape and Left/Right-as-paging are handled by the global listener.
      });
      listEl.appendChild(row);
    });
    focusResultRow(focusIndex);
  }

  function showPreview(album, index) {
    const art = album.images?.[0]?.url || "";
    const artist = album.artists.map(a => a.name).join(", ");
    const owned = isOnShelf(album.id);
    resultsEl.innerHTML = `
      <button class="back-btn" id="back-btn">‹ back to results</button>
      <div class="preview-card">
        <img src="${art}" alt="" />
        <div class="preview-text">
          <p class="preview-title">${escapeHtml(album.name)}</p>
          <p class="preview-artist">${escapeHtml(artist)}</p>
        </div>
        <button class="add-btn" id="add-btn"${owned ? " disabled" : ""}>${owned ? "Added" : "Add"}</button>
      </div>
    `;
    const addBtn = document.getElementById("add-btn");
    const backBtn = document.getElementById("back-btn");
    addBtn.addEventListener("click", () => addToShelf(album));
    backBtn.addEventListener("click", () => renderResults(lastResults, index));
    addBtn.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") { e.preventDefault(); addBtn.click(); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); backBtn.click(); }
    });
    addBtn.focus();
  }

  function addToShelf(album) {
    const addBtn = document.getElementById("add-btn");
    // The button itself is already disabled and reads "Added" for anything
    // already on the shelf (set in showPreview) — this is just a defensive
    // backstop against that state somehow being stale, not a user-facing
    // warning anymore.
    if (isOnShelf(album.id)) return;
    if (addBtn) { addBtn.disabled = true; addBtn.textContent = "Adding…"; }
    buildAndAddRecord(album).then(() => clearSearch());
  }

  function buildAndAddRecord(album) {
    // The shared "turn a Spotify album object into a shelf record" step —
    // used by the search Add button above and the new-releases feed's own
    // Add buttons below. Each caller handles its own button state and
    // what happens to the surrounding view afterward; this just does the
    // actual adding, and returns the record once it's on the shelf.
    const art = album.images?.[0]?.url || "";
    return getAverageColor(art).then(({ rgb, textColor }) => {
      const record = {
        id: album.id,
        name: album.name,
        artist: album.artists.map(a => a.name).join(", "),
        artistIds: album.artists.map(a => a.id),     // for the follow icon on the hover card
        artistNames: album.artists.map(a => a.name),
        art,
        url: album.external_urls.spotify,
        year: (album.release_date || "").slice(0, 4),
        tracks: album.total_tracks,
        trackList: [], // fetched lazily the first time you hover deep into the card
        tags: [],
        durationMs: album.durationMs || undefined, // song-link singles know their length up front;
                                                    // album-based ones fill it in on first hover
        trackUri: album.trackUri || undefined, // set only for a single added from a song link:
                                                // it plays just that track, not an album context
        isSingle: album.total_tracks === 1, // exactly one track = a "single": slim hover card,
                                             // lives in the Crate until filed into Singles
        inSingles: false,
        releaseDate: album.release_date || "", // full date, shown on a single's card
        stars: 0, // unrated / "haven't listened yet" — the record everywhere
                   // else already treats a missing value as 0 too, but
                   // setting it explicitly here keeps a fresh record's
                   // shape consistent with tags/trackList above
        isFresh: true, // the gold "unwrapped" sheen — cleared on first
                        // hover, see attachHoverBehavior's onOpen callback
        spineRGB: rgb,
        spineTextColor: textColor,
      };
      shelf.push(record);
      saveShelf();
      markDirty();
      cacheArt(art); // keep a local copy of the cover for offline use
      // A freshly added record always starts in the Crate (0 stars) — jump
      // straight to that view so it's actually visible where it landed,
      // exclusively (replacing whatever filter selection was active
      // before), rather than leaving the shelf on some other filtered view
      // where the very thing you just added would be invisible.
      activeTagFilters.clear();
      activeTagFilters.add(CRATE_KEY);
      saveActiveFilters();
      updateFilterToggleState();
      renderShelf(record.id);
      return record;
    });
  }

  function getAverageColor(url) {
    return new Promise((resolve) => {
      if (!url) return resolve({ rgb: FALLBACK_SPINE_RGB, textColor: "var(--cream)" });
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        try {
          const size = 8;
          const canvas = document.createElement("canvas");
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, size, size);
          const data = ctx.getImageData(0, 0, size, size).data;
          let r = 0, g = 0, b = 0, count = 0;
          for (let i = 0; i < data.length; i += 4) {
            r += data[i]; g += data[i + 1]; b += data[i + 2]; count++;
          }
          r = Math.round(r / count); g = Math.round(g / count); b = Math.round(b / count);
          const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
          resolve({
            rgb: { r, g, b },
            textColor: luminance > 0.6 ? "var(--wood-dark)" : "var(--cream)",
          });
        } catch (err) {
          // Cross-origin pixel read blocked — fall back to a plain neutral spine.
          resolve({ rgb: FALLBACK_SPINE_RGB, textColor: "var(--cream)" });
        }
      };
      img.onerror = () => resolve({ rgb: FALLBACK_SPINE_RGB, textColor: "var(--cream)" });
      img.src = url;
    });
  }

  function ensureSpineColor(record, spineEl, labelEl) {
    if (record.spineRGB) return;
    getAverageColor(record.art).then(({ rgb, textColor }) => {
      record.spineRGB = rgb;
      record.spineTextColor = textColor;
      saveShelf();
      spineEl.style.backgroundImage = spineBackgroundImage(rgb, record.art);
      labelEl.style.color = textColor;
    });
  }

  function spineBackgroundImage(rgb, art) {
    const wash = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.8)`;
    return art
      ? `linear-gradient(${wash}, ${wash}), url('${art}')`
      : `linear-gradient(${wash}, ${wash})`;
  }

  function removeFromShelf(id) {
    shelf = shelf.filter((r) => r.id !== id);
    saveShelf();
    markDirty();
    renderShelf();
  }

  // ---- Tags: custom, user-created — not read from Spotify's genre data at all.
  // Tags have their own persisted existence (allTagNames) independent of which
  // records currently carry them — a tag created once stays available even if
  // every record that had it gets untagged. It previously used the union of
  // every record's own tags as the master list, which meant a tag with only
  // one record on it would vanish entirely the moment that one association
  // was removed — not a deliberate deletion, just an accidental side effect
  // of how the list was derived. ----

  function getAllTags() {
    return Array.from(allTagNames).filter((t) => t.toLowerCase() !== DOWNLOADED_KEY).sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));
  }

  function registerTagName(name) {
    const exists = Array.from(allTagNames).some((t) => t.toLowerCase() === name.toLowerCase());
    if (!exists) { allTagNames.add(name); saveAllTagNames(); }
  }

  function addTagToRecord(record, name) {
    if (!record.tags) record.tags = [];
    const exists = record.tags.some((t) => t.toLowerCase() === name.toLowerCase());
    if (!exists) record.tags.push(name);
    saveShelf();
    registerTagName(name);
    markDirty();
  }

  function setRecordTag(record, name, shouldHave) {
    if (!record.tags) record.tags = [];
    const idx = record.tags.findIndex((t) => t.toLowerCase() === name.toLowerCase());
    if (shouldHave && idx === -1) record.tags.push(name);
    else if (!shouldHave && idx !== -1) record.tags.splice(idx, 1);
    saveShelf();
    markDirty();
    const key = name.toLowerCase();
    const affectsCurrentView = activeTagFilters.has(key) ||
      (!activeTagFilters.size && excludedTags.has(key));
    if (affectsCurrentView) renderShelf();
  }

  function deleteTagEverywhere(name) {
    const key = name.toLowerCase();
    let changed = false;
    shelf.forEach((r) => {
      if (!r.tags) return;
      const idx = r.tags.findIndex((t) => t.toLowerCase() === key);
      if (idx !== -1) { r.tags.splice(idx, 1); changed = true; }
    });
    if (changed) saveShelf();
    // This is the one path that should actually remove a tag from existence —
    // an explicit delete, not an incidental side effect of untagging a record.
    const masterMatch = Array.from(allTagNames).find((t) => t.toLowerCase() === key);
    if (masterMatch) { allTagNames.delete(masterMatch); saveAllTagNames(); }
    if (changed || masterMatch) markDirty();
    let viewAffected = changed;
    if (activeTagFilters.has(key)) { activeTagFilters.delete(key); saveActiveFilters(); viewAffected = true; }
    if (excludedTags.has(key)) { excludedTags.delete(key); saveExcludedTags(); }
    updateFilterToggleState();
    if (viewAffected) { currentPage = 0; renderShelf(); }
  }

  function renameTagEverywhere(oldName, newName) {
    const oldKey = oldName.toLowerCase();
    const newKey = newName.toLowerCase();
    if (newKey === oldKey && newName === oldName) return; // genuinely unchanged
    // "Crate" is reserved, same as when creating a brand-new tag — refuse
    // silently rather than creating a name collision with the pseudo-tag.
    if (isReservedTagName(newName)) return;
    // Refuse a collision with a *different* existing tag (renaming "Rock"
    // to "Jazz" when "Jazz" already exists) — merging two tags together is
    // a bigger decision than a rename and not what was asked for here. A
    // pure case change of the same tag (oldKey === newKey) is fine and
    // falls through to the rename below.
    if (newKey !== oldKey && Array.from(allTagNames).some((t) => t.toLowerCase() === newKey)) return;

    let changed = false;
    shelf.forEach((r) => {
      if (!r.tags) return;
      const idx = r.tags.findIndex((t) => t.toLowerCase() === oldKey);
      if (idx !== -1) { r.tags[idx] = newName; changed = true; }
    });
    if (changed) saveShelf();
    const masterMatch = Array.from(allTagNames).find((t) => t.toLowerCase() === oldKey);
    if (masterMatch) { allTagNames.delete(masterMatch); allTagNames.add(newName); saveAllTagNames(); }
    if (changed || masterMatch) markDirty();
    // Carry the filter/exclusion selection across the rename, so renaming
    // the tag you're currently looking at doesn't silently kick you off it.
    let viewAffected = false;
    if (activeTagFilters.has(oldKey)) { activeTagFilters.delete(oldKey); activeTagFilters.add(newKey); saveActiveFilters(); viewAffected = true; }
    if (excludedTags.has(oldKey)) { excludedTags.delete(oldKey); excludedTags.add(newKey); saveExcludedTags(); }
    updateFilterToggleState();
    renderFilterList();
    if (viewAffected) { currentPage = 0; renderShelf(); }
  }

  function renderTagList(record, tagListEl) {
    const allTags = getAllTags();
    const recordTags = (record.tags || []).map((t) => t.toLowerCase());
    tagListEl.innerHTML = allTags.map((tag, i) => {
      const isActive = recordTags.includes(tag.toLowerCase());
      const cbId = `tagcb-${record.id}-${i}`;
      return `<li><label class="tag-pill${isActive ? " active" : ""}"><input type="checkbox" id="${cbId}" data-tag="${escapeHtml(tag)}" ${isActive ? "checked" : ""} /><span class="tag-pill-text">${escapeHtml(tag)}</span></label></li>`;
    }).join("");
    // A real checkbox drives the tag-toggle state, but the actual interaction
    // is handled on pointerdown against the pill/label directly — see the
    // delegated listeners set up once in buildRecordEl. New tags are created
    // via the separate bar above this grid, not from within it.

    // Mark pills whose text is actually too long to fit, so only those get
    // the hover-scroll treatment (reading scrollWidth/clientWidth here forces
    // a layout pass, but this list is small so it's cheap).
    tagListEl.querySelectorAll(".tag-pill").forEach((pill) => {
      const overflowAmount = pill.scrollWidth - pill.clientWidth;
      if (overflowAmount > 1) {
        pill.classList.add("overflows");
        pill.style.setProperty("--scroll-distance", `-${overflowAmount + 6}px`);
      }
    });
  }

  // A single is a record added with exactly one track. Until you move it into
  // Singles it sits in the Crate; once in Singles it's visible only when the
  // Singles view is selected. It never appears on the main shelf.

  function getVisibleShelf() {
    // The Crate and Singles are pseudo-tags, not real tags on any record —
    // selecting either OR's in its records alongside whatever real tags are
    // also selected (Cmd+click), same as any other multi-select combination.
    const crateSelected = activeTagFilters.has(CRATE_KEY);
    const singlesSelected = activeTagFilters.has(SINGLES_KEY);
    let visible;
    if (activeTagFilters.size) {
      // Explicit selection always works, even for an otherwise-excluded tag.
      // Multiple selected tags are OR'd together — any match is shown.
      visible = shelf.filter((r) =>
        (r.tags || []).some((t) => activeTagFilters.has(t.toLowerCase())) ||
        (crateSelected && inCrate(r)) ||
        (singlesSelected && inSinglesView(r))
      );
    } else if (excludedTags.size) {
      // The "All records" baseline hides anything carrying an excluded tag.
      visible = shelf.filter((r) => !(r.tags || []).some((t) => excludedTags.has(t.toLowerCase())));
    } else {
      visible = shelf;
    }
    // Crate records (unrated albums, and singles not yet filed) and Singles
    // live only in their own views and are never visible anywhere else — not
    // on "All records", not under a real tag filter.
    visible = visible.filter((r) => {
      if (isSingleRecord(r)) return r.inSingles ? singlesSelected : crateSelected;
      return (r.stars || 0) !== 0 || crateSelected;
    });
    if (activeStarFilters.size) {
      // Independent of the tag filter above (the two AND together when both
      // are active) — and deliberately an *exact* match per tier, not "this
      // many stars or more": selecting 2 stars shows only 2-star records,
      // not 2-and-3-star ones. Multiple selected tiers (via Cmd+click) are
      // OR'd together, same as multi-selected tags. Singles have no rating,
      // so a star tier never matches one.
      visible = visible.filter((r) => activeStarFilters.has(r.stars || 0));
    }
    return visible;
  }

  function renderShelf(justAddedId) {
    shelf.sort((a, b) => sortableArtist(a.artist).localeCompare(sortableArtist(b.artist), undefined, { sensitivity: "base" }));
    saveShelf();

    const pages = computePages();

    if (justAddedId) {
      const pageIdx = pages.findIndex((p) => p.some((r) => r.id === justAddedId));
      if (pageIdx !== -1) currentPage = pageIdx;
    }
    if (currentPage >= pages.length) currentPage = Math.max(0, pages.length - 1);
    if (currentPage < 0) currentPage = 0;

    renderPageContent(pages[currentPage] || [], justAddedId);
    updatePageArrows(pages.length);
  }

  let fadeRenderTimer = null;
  function renderShelfWithFade() {
    // A gentler transition specifically for filter changes — the shelf's
    // contents can change entirely in one click, so a plain instant swap
    // felt abrupt. Not used for ordinary add/remove/zoom updates, which
    // should stay immediate. The swap happens slightly before the fade-out
    // fully finishes (70ms into a 100ms fade), while opacity is already low
    // but not quite zero — that keeps the moment of true "nothing visible"
    // as brief as possible, rather than a full fade-out pause before the
    // fade-in even starts.
    clearTimeout(fadeRenderTimer);
    recordsEl.style.transition = "opacity 0.1s ease";
    recordsEl.style.opacity = "0";
    fadeRenderTimer = setTimeout(() => {
      renderShelf();
      recordsEl.style.transition = "opacity 0.35s ease";
      requestAnimationFrame(() => { recordsEl.style.opacity = "1"; });
    }, 70);
  }

  function computePages() {
    const containerWidth = recordsEl.parentElement.clientWidth || 600;
    const gap = 2;
    const pages = [];
    let page = [];
    let widthUsed = 0;

    getVisibleShelf().forEach((r) => {
      const hash = hashString(r.id);
      const w = computeBaseWidth(r.tracks, hash, r.isSingle) * zoom;
      if (widthUsed + w + gap > containerWidth && page.length > 0) {
        pages.push(page);
        page = [];
        widthUsed = 0;
      }
      page.push(r);
      widthUsed += w + gap;
    });
    if (page.length) pages.push(page);
    return pages.length ? pages : [[]];
  }

  function renderPageContent(records, justAddedId) {
    recordsEl.innerHTML = "";
    // Whatever was "open" a moment ago is gone now — the actual .record
    // elements that openCardCount was counting are about to be destroyed
    // and rebuilt from scratch below, with none of them starting in the
    // open state. Without this reset, anything that rebuilds the shelf
    // while a card is genuinely open (e.g. removing the very record you're
    // hovering) orphans the counter above zero forever, since the only
    // other place it's decremented is closeRecordCard's mouseleave handler
    // on an element that no longer exists.
    if (openCardCount !== 0) {
      openCardCount = 0;
      const searchZone = document.getElementById("search-zone");
      if (searchZone) searchZone.classList.remove("dimmed-for-card");
    }
    const visibleCount = getVisibleShelf().length;
    emptyHint.classList.toggle("hidden", visibleCount > 0);
    if (!visibleCount) {
      emptyHint.innerHTML = (activeTagFilters.size === 1 && activeTagFilters.has(DOWNLOADED_KEY))
        ? `<span class="empty-hint-title">Nothing marked as downloaded${isOffline ? " yet" : ""}</span><span class="empty-hint-sub">tick the download button on a record's card once it's saved in Spotify</span>`
        : activeTagFilters.size
        ? `<span class="empty-hint-title">No records tagged "${escapeHtml(Array.from(activeTagFilters).join('" or "'))}"</span>`
        : `<span class="empty-hint-title">Shelf is empty</span><span class="empty-hint-sub">search above to add your first record</span>`;
      recordsEl.appendChild(emptyHint);
      return;
    }
    records.forEach((r) => recordsEl.appendChild(buildRecordEl(r, r.id === justAddedId)));
    updatePlayingSpineIndicator(); // reapply in case the playing record is on this page
  }

  function updatePageArrows(pageCount) {
    const showPrev = currentPage > 0;
    const showNext = currentPage < pageCount - 1;
    pagePrevBtn.classList.toggle("visible", showPrev);
    pageNextBtn.classList.toggle("visible", showNext);
  }

  async function changePage(direction) {
    const pages = computePages();
    const newPage = direction === "next" ? currentPage + 1 : currentPage - 1;
    if (newPage < 0 || newPage >= pages.length) return;

    const exitClass = direction === "next" ? "page-exit-left" : "page-exit-right";
    const enterClass = direction === "next" ? "page-enter-right" : "page-enter-left";

    recordsEl.classList.add(exitClass);
    await wait(300);

    currentPage = newPage;
    renderPageContent(pages[currentPage]);

    recordsEl.classList.add("no-transition", enterClass);
    void recordsEl.offsetWidth; // force reflow so the enter position applies before we transition away from it
    recordsEl.classList.remove("no-transition", exitClass);
    requestAnimationFrame(() => recordsEl.classList.remove(enterClass));

    updatePageArrows(pages.length);
  }

  pagePrevBtn.addEventListener("click", () => changePage("prev"));
  pageNextBtn.addEventListener("click", () => changePage("next"));

  function buildRecordEl(r, justAdded) {
    const el = document.createElement("div");
    el.className = "record" + (r.isSingle ? " is-single" : "") + (justAdded ? " entering" : "");
    el.tabIndex = 0;
    el.setAttribute("role", "button");
    el.setAttribute("aria-label", `Play ${r.name} by ${r.artist} on Spotify`);

    const trackListHtml = (r.trackList && r.trackList.length)
      ? r.trackList.map((t, i) => trackRowHtml(t, i)).join("")
      : "";

    const spineRGB = r.spineRGB || FALLBACK_SPINE_RGB;
    const spineTextColor = r.spineTextColor || "var(--cream)";

    const hash = hashString(r.id);
    const baseWidth = computeBaseWidth(r.tracks, hash, r.isSingle);
    const era = getEraStyle(r.year);
    const sizeFactor = 0.85 + ((Math.floor(hash / 7) % 30) / 100); // 0.85–1.14
    const baseFontSize = era.baseSize * sizeFactor;
    const positionStyle = SPINE_POSITIONS[hash % SPINE_POSITIONS.length];
    const bgImage = spineBackgroundImage(spineRGB, resolveArt(r.art));

    const effectiveWidth = baseWidth * zoom;
    const effectiveFont = clampFont(baseFontSize * zoom, effectiveWidth);
    const labelHidden = effectiveWidth < 9;

    el.style.width = effectiveWidth + "px";
    el.dataset.baseWidth = baseWidth;
    el.dataset.recordId = r.id;

    el.innerHTML = `
      <div class="spine" style="background-image:${bgImage}; background-size:cover; background-position:center;">
        <span class="spine-label" data-base-font="${baseFontSize}" style="color:${spineTextColor}; ${eraCss(era)} font-size:${effectiveFont}rem; opacity:${labelHidden ? 0 : 1}; ${positionStyle}">${escapeHtml(r.name)}</span>
        ${r.isFresh ? `<div class="fresh-sheen"></div>` : ""}
        <div class="playing-sheen"></div>
      </div>
      <div class="card-wrap">
        <div class="tag-panel">
          <div class="tag-panel-inner">
            <div class="tag-new-row">
              <input type="text" class="tag-new-input" placeholder="new tag…" maxlength="24" />
              <button class="tag-new-btn" type="button">+</button>
              <button class="tag-dl-btn" type="button" title="Downloaded in Spotify (playable offline)" aria-label="Mark as downloaded in Spotify" aria-pressed="false">${DL_TICK_SVG}</button>
            </div>
            <ul class="tag-list"></ul>
          </div>
        </div>
        <div class="sleeve">
          <div class="sleeve-cover" title="Play ${escapeHtml(r.name)}">
            <img src="${resolveArt(r.art)}" alt="" />
            <div class="play-overlay"><svg viewBox="0 0 24 24" width="30" height="30" fill="white"><path d="M7 4L21 12L7 20V4Z"/></svg></div>
          </div>
          <div class="sleeve-info">
            <button class="remove-btn" title="Remove from shelf">✕</button>
            <p class="sleeve-title">${escapeHtml(r.name)}</p>
            <div class="sleeve-artist-row">
              <p class="sleeve-artist">${escapeHtml(r.artist)}</p>
              <button type="button" class="follow-btn" hidden><svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8z"/></svg></button>
            </div>
            ${r.isSingle
              ? `<div class="sleeve-meta"><span>${escapeHtml(formatFullDate(r.releaseDate) || r.year)}</span><span class="star-rating"></span><span class="single-label">Single${r.durationMs ? ` · ${formatDuration(r.durationMs)}` : ""}</span></div>
                 ${r.inSingles ? "" : `<button type="button" class="single-shelf-btn">Add to Singles</button>`}`
              : `<div class="sleeve-meta"><span>${r.year}</span><span class="star-rating">${starRatingHtml(r.stars || 0)}</span><span>${r.tracks} tracks</span></div>`}
          </div>
        </div>
        <div class="track-panel">
          <div class="track-panel-inner">
            <ul class="track-list">${trackListHtml}</ul>
            <div class="track-duration-total">${r.totalDuration || ""}</div>
          </div>
        </div>
      </div>`;

    const open = (e) => {
      if (e.target.closest(".remove-btn")) return;
      const trackLi = e.target.closest(".track-list li");
      const coverClicked = e.target.closest(".sleeve-cover");
      if (trackLi) {
        playAlbumOnDevice(r, trackLi.dataset.uri);
        // Stays open per feedback — picking a specific track is a browsing
        // action (you might want to try another track next), unlike
        // clicking the cover below, which plays the album from the start
        // and closes the card the same way it always has.
      } else if (coverClicked) {
        playAlbumOnDevice(r);
        // No longer force-closing the card here — per feedback, hitting
        // play shouldn't dismiss the card out from under you; it should
        // stay open for exactly as long as you're still hovering it, the
        // same as everything else that happens on an open card (rating,
        // tagging, picking a specific track above). The existing
        // mouseleave handler in attachHoverBehavior already closes it the
        // moment the mouse actually leaves.
      }
    };
    el.addEventListener("click", open);
    el.addEventListener("keydown", (e) => {
      // Space is reserved globally for play/pause now — only Enter plays
      // this specific record.
      if (e.key === "Enter") {
        e.preventDefault();
        playAlbumOnDevice(r);
        // Same reasoning as the cover-click path above — stays open,
        // closing only via the normal hover/focus rules (or Escape, same
        // as anywhere else in the panel-driven UI).
      }
    });
    el.querySelector(".remove-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      removeFromShelf(r.id);
    });

    const starRatingEl = el.querySelector(".star-rating");
    starRatingEl.addEventListener("pointerdown", (e) => {
      // Clicking a star button natively focuses it, which briefly lights up
      // .record:focus-within's gold spine outline — and then the click
      // handler below immediately rebuilds this row's HTML, destroying the
      // just-focused button and dropping focus back to <body>, which turns
      // the outline off again just as fast. Net effect: a momentary yellow
      // flash on the spine on every single rating click. Since keyboard
      // Tab-focus (not pointer clicks) is the only reason this button needs
      // to be focusable at all, just don't let a pointer click focus it in
      // the first place — preventDefault() here blocks the native focus
      // step without blocking the click event that follows.
      if (e.target.closest(".star-rating-icon")) e.preventDefault();
    });
    starRatingEl.addEventListener("click", (e) => {
      e.stopPropagation(); // don't also trigger the card's own play action
      const starBtn = e.target.closest(".star-rating-icon");
      if (!starBtn) return;
      const clicked = Number(starBtn.dataset.star);
      // Clicking the currently-set top star clears it back to unrated,
      // same toggle-off convention used elsewhere (tags, filters) — any
      // other star sets the rating to that number outright.
      const newStars = r.stars === clicked ? 0 : clicked;
      const wasUnrated = (r.stars || 0) === 0;
      const becomingUnrated = newStars === 0;

      if (becomingUnrated && !wasUnrated) {
        // Clearing a real rating back to 0 sends the record to the Crate —
        // confirm first rather than doing that as a side effect of what
        // might have been a slightly-too-hard click on the top star.
        openMoveToCratePopover(starBtn, () => {
          r.stars = 0;
          saveShelf();
          if (getVisibleShelf().includes(r)) {
            starRatingEl.innerHTML = starRatingHtml(r.stars);
          } else {
            renderShelf();
          }
        });
        return;
      }

      if (wasUnrated && !becomingUnrated) {
        // Rating a Crate record doesn't move it to the shelf on its own —
        // that modal is what actually applies the rating (and the tags
        // picked in it) once "Add to collection" is confirmed. Nothing
        // changes here until then; cancelling the modal leaves this
        // record exactly as it was.
        openCratePromoteModal(r, newStars, starRatingEl);
        return;
      }

      // Both the old and new ratings are non-zero (e.g. 1 star → 2 stars) —
      // no Crate boundary is being crossed either way, so this applies
      // immediately exactly as it always has.
      r.stars = newStars;
      saveShelf();
      if (getVisibleShelf().includes(r)) {
        starRatingEl.innerHTML = starRatingHtml(r.stars);
      } else {
        renderShelf();
      }
    });

    const listEl = el.querySelector(".track-list");
    const durationEl = el.querySelector(".track-duration-total");
    const tagListEl = el.querySelector(".tag-list");
    const tagNewInput = el.querySelector(".tag-new-input");
    const tagNewBtn = el.querySelector(".tag-new-btn");
    const dlBtn = el.querySelector(".tag-dl-btn");
    const syncDlBtn = () => {
      const on = recordIsDownloaded(r);
      dlBtn.classList.toggle("active", on);
      dlBtn.setAttribute("aria-pressed", on ? "true" : "false");
    };
    syncDlBtn();
    dlBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      setRecordTag(r, DOWNLOADED_NAME, !recordIsDownloaded(r));
      syncDlBtn();
    });
    renderTagList(r, tagListEl); // initial synchronous render — no network needed for tags

    tagListEl.addEventListener("pointerdown", (e) => {
      // Handling this on pointerdown, and managing everything ourselves,
      // rather than relying on the browser's native "label activates its
      // checkbox" behavior — real testing showed that native step simply
      // doesn't run on a control that only just became interactive (the
      // card just opened): the first click only focuses it, and it took a
      // fast second click for the browser to actually forward the toggle.
      // pointerdown itself fired reliably and immediately every single
      // time in that testing, so it's the one thing here we can trust.
      const label = e.target.closest(".tag-pill");
      if (!label) return;
      const checkbox = label.querySelector("input[type=checkbox]");
      if (!checkbox) return;
      e.preventDefault(); // we're taking over the activation — don't let the native (unreliable) version also run
      checkbox.checked = !checkbox.checked;
      setRecordTag(r, checkbox.dataset.tag, checkbox.checked);
      label.classList.toggle("active", checkbox.checked);
    });

    tagListEl.addEventListener("click", (e) => e.stopPropagation()); // keep clicks in this panel from also triggering the record's own play action

    tagListEl.addEventListener("change", (e) => {
      // Only ever fires for a genuine keyboard-triggered toggle (Tab, then
      // Space) — our own pointerdown-driven mouse toggle above sets .checked
      // directly via JS, which never dispatches a native "change" event, so
      // there's no double-handling between the two paths.
      const checkbox = e.target.closest("input[type=checkbox]");
      if (!checkbox) return;
      setRecordTag(r, checkbox.dataset.tag, checkbox.checked);
      const pill = checkbox.closest(".tag-pill");
      if (pill) pill.classList.toggle("active", checkbox.checked);
    });

    const submitNewTag = () => {
      const name = tagNewInput.value.trim();
      if (!name) return;
      // "Crate" is reserved for the pseudo-tag that stands for 0-star
      // records — it's never a real, addable tag on a card, so a name that
      // collides with it (case-insensitively) is silently dropped rather
      // than creating a same-named real tag that would fight with it.
      if (isReservedTagName(name)) {
        tagNewInput.value = "";
        return;
      }
      addTagToRecord(r, name);
      tagNewInput.value = "";
      renderTagList(r, tagListEl);
    };
    tagNewBtn.addEventListener("click", (e) => { e.stopPropagation(); submitNewTag(); });
    tagNewInput.addEventListener("click", (e) => e.stopPropagation());
    tagNewInput.addEventListener("keydown", (e) => {
      e.stopPropagation();
      if (e.key === "Enter") { e.preventDefault(); submitNewTag(); }
    });

    const singleBtn = el.querySelector(".single-shelf-btn");
    if (singleBtn) {
      singleBtn.addEventListener("click", (e) => {
        e.stopPropagation(); // same-event bubbling to the document "click outside" closers
        r.inSingles = true;
        saveShelf(); markDirty(); renderShelf();
      });
    }

    const followBtn = el.querySelector(".follow-btn");
    followBtn.addEventListener("click", (e) => {
      // stopPropagation keeps this click from reaching the document-level
      // "click outside closes the popover" listener in the same event (the
      // popover this may open would otherwise be closed instantly), and from
      // triggering the card's own play action.
      e.stopPropagation();
      onFollowBtnClick(followBtn);
    });

    attachHoverBehavior(el, () => {
      if (!r.isSingle) { ensureTrackList(r, listEl, durationEl); syncDlBtn(); renderTagList(r, tagListEl); }
      else if (!r.durationMs) {
        // Older singles don't know their length yet — fetch it once, then show it.
        // (Song-link singles added before v114 are the case v114 missed: their id is a
        // track id, so the length comes from the track itself, not an album lookup.)
        (r.trackUri ? fetchSingleTrackDuration(r) : fetchTrackListIfNeeded(r)).then(() => {
          const lab = el.querySelector(".single-label");
          if (lab && r.durationMs) lab.textContent = `Single · ${formatDuration(r.durationMs)}`;
        });
      }
      syncFollowButton(r, followBtn); // refreshed once per opening, so it stays honest about
                                    // tags created on other cards without disrupting a click in progress
      if (r.isFresh) {
        // First hover ever — the "unwrap it" moment. Fade the sheen out and
        // drop it from the DOM once the fade finishes, and persist the
        // cleared state so it doesn't come back on reload.
        r.isFresh = false;
        saveShelf();
        const sheenEl = el.querySelector(".fresh-sheen");
        if (sheenEl) {
          sheenEl.classList.add("fading");
          setTimeout(() => sheenEl.remove(), 650); // after its own 0.6s fade finishes
        }
      }
    });

    const spineEl = el.querySelector(".spine");
    const labelEl = el.querySelector(".spine-label");
    ensureSpineColor(r, spineEl, labelEl);

    const cardWrapEl = el.querySelector(".card-wrap");
    cardWrapEl.addEventListener("focusin", () => {
      if (r.isSingle) return;
      ensureTrackList(r, listEl, durationEl);
      renderTagList(r, tagListEl);
    });

    return el;
  }

  let topZ = 10;

  function closeRecordCard(el) {
    // Removing "open" alone isn't enough — .record:focus-within also keeps
    // the card visually open (independently, via CSS), and almost any click
    // inside it (a tag pill, the create input, a track row) naturally leaves
    // something focused as a normal side effect. Without releasing that
    // focus too, the card stays stuck open until focus is moved elsewhere
    // by some other means, regardless of the mouse or the "open" class.
    const wasOpen = el.classList.contains("open");
    el.classList.remove("open");
    if (document.activeElement && el.contains(document.activeElement)) {
      document.activeElement.blur();
    }
    if (wasOpen) {
      openCardCount = Math.max(0, openCardCount - 1);
      if (openCardCount === 0) {
        const searchZone = document.getElementById("search-zone");
        if (searchZone) searchZone.classList.remove("dimmed-for-card");
      }
    }
  }

  function attachHoverBehavior(el, onOpen) {
    // A short delay (rather than plain CSS :hover) so briefly crossing the
    // small gap between the spine and the card above it doesn't close it.
    let hideTimer = null;
    const show = () => {
      clearTimeout(hideTimer);
      const wasOpen = el.classList.contains("open");
      // Measure the resting (closed, untransformed) position *before*
      // adding "open" below — reading it after is unreliable, since the
      // CSS transition that class triggers hasn't necessarily moved
      // anything yet at the moment JS resumes running.
      const restRect = el.getBoundingClientRect();
      el.classList.add("open");
      el.style.zIndex = ++topZ; // whichever record you hovered most recently always sits on top
      if (!wasOpen) {
        openCardCount++;
        // Rather than shrinking the card to fit above the search controls
        // (what this used to do), dim the controls out of the way instead
        // and let the card render at its natural size — the controls
        // aren't something you'd be reaching for while a card is open
        // anyway, and shrinking a small info card down to fit a gap that
        // kept getting tighter every time the shelf's own layout changed
        // is what made cards feel "ruined" compared to earlier versions.
        const searchZone = document.getElementById("search-zone");
        if (searchZone) searchZone.classList.add("dimmed-for-card");
      }
      // The card still can't be allowed to grow forever — on a very short
      // window a fixed-pixel card could still reach past the very top of
      // the page. This is a much more generous backstop than before (the
      // whole point of dimming the search controls above is to remove
      // them as a constraint entirely) — it only engages if the card
      // would otherwise go off-screen, not merely close to the controls.
      // Deliberately measured against the viewport's own top (0), not the
      // scene's — on a layout where the scene is much smaller than the
      // viewport (a tall, narrow phone screen, where the scene shrinks to
      // fit the available width and ends up short), bounding the card to
      // the scene's own edge was needlessly tight: .scene has
      // overflow: visible and only .page clips, so the card can safely
      // use that full extra space above the scene, right up to the
      // actual edge of the screen.
      const sleeve = el.querySelector(".sleeve");
      if (sleeve) {
        const liftedTop = restRect.top - 42 - 0.08 * restRect.height;
        const available = liftedTop - 0 - 12; // 12px breathing room
        const openScale = 1.08;
        sleeve.style.maxHeight = Math.max(120, available / openScale) + "px";
      }
      // Only fire once per genuine opening, not on every mouseenter while already
      // open (moving the mouse around inside an open card was re-triggering this
      // repeatedly, rebuilding — and sometimes losing — whatever you were about to click).
      if (!wasOpen && onOpen) onOpen();
    };
    const hide = () => { hideTimer = setTimeout(() => closeRecordCard(el), 250); };
    el.addEventListener("mouseenter", show);
    el.addEventListener("mouseleave", hide);
  }

  async function fetchSingleTrackDuration(record) {
    if (record.durationMs || isOffline) return;
    if (record._loadingTracks) return record._loadingTracks;
    record._loadingTracks = (async () => {
      try {
        const token = await getAccessToken();
        const res = await fetch(`https://api.spotify.com/v1/tracks/${record.id}`, { headers: { Authorization: `Bearer ${token}` } });
        if (!res.ok) throw new Error("Track length fetch failed");
        const t = await res.json();
        if (t.duration_ms) { record.durationMs = t.duration_ms; saveShelf(); }
      } catch (err) { console.error(err); }
      finally { record._loadingTracks = null; }
    })();
    return record._loadingTracks;
  }

  async function fetchTrackListIfNeeded(record) {
    if (isOffline) return record.trackList || null;
    // Checking totalDuration too, not just trackList — a record whose
    // trackList was cached before the duration feature existed (or from
    // any other partial-cache path) would otherwise short-circuit here
    // forever and never backfill the missing duration, even though the
    // data needed to compute it is one fetch away. Confirmed this was
    // happening with a record seeded to look exactly like that case.
    if (record.trackUri) return record.trackList || []; // a song-link single: id is a track id, there's no album to fetch
    if (record.trackList && record.trackList.length && record.totalDuration && record.artistIds && record.artistIds.length && (!record.isSingle || record.durationMs)) return record.trackList;
    if (record._loadingTracks) return record._loadingTracks; // already in flight — share the same promise
    record._loadingTracks = (async () => {
      try {
        const token = await getAccessToken();
        const res = await fetch(`https://api.spotify.com/v1/albums/${record.id}`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        if (!res.ok) throw new Error("Track fetch failed");
        const details = await res.json();
        record.trackList = (details.tracks?.items || []).map((t) => ({
          name: t.name,
          duration: formatDuration(t.duration_ms),
          uri: t.uri,
        }));
        // Total album duration — computed here rather than fetched
        // separately, since this same response already has every
        // track's duration_ms; summing them is free once we're here.
        const totalMs = (details.tracks?.items || []).reduce((sum, t) => sum + (t.duration_ms || 0), 0);
        record.totalDuration = formatAlbumDuration(totalMs);
        if (Number(record.tracks) === 1 || record.isSingle) record.durationMs = (details.tracks?.items || [])[0]?.duration_ms || record.durationMs;
        // Same response also carries the artist ids the follow icon needs —
        // this is how records added before the icon existed get backfilled.
        record.artistIds = (details.artists || []).map((a) => a.id);
        record.artistNames = (details.artists || []).map((a) => a.name);
        saveShelf();
        return record.trackList;
      } catch (err) {
        console.error(err);
        return null;
      } finally {
        record._loadingTracks = null;
      }
    })();
    return record._loadingTracks;
  }

  async function ensureTrackList(record, listEl, durationEl) {
    // Checking totalDuration too, not just trackList — same reasoning as
    // fetchTrackListIfNeeded above, which this calls into: without this,
    // a record with an already-cached trackList but no totalDuration
    // (anything cached before the duration feature existed) would return
    // here immediately and never trigger the fetch needed to backfill it.
    const hasTrackList = record.trackList && record.trackList.length;
    if (isOffline) {
      if (!hasTrackList) listEl.innerHTML = `<li class="track-loading">Track list needs internet</li>`;
      return;
    }
    const hasDuration = !!record.totalDuration && !!(record.artistIds && record.artistIds.length);
    if (hasTrackList && hasDuration) return; // genuinely already have everything

    // Only show the loading state (and later replace it) when the
    // tracklist itself is what's missing — if it's already rendered
    // correctly and just the duration needs backfilling, fetching quietly
    // in the background is much better than flashing an already-fine
    // tracklist back to a loading state for no visible reason.
    if (!hasTrackList) listEl.innerHTML = `<li class="track-loading">Loading tracks…</li>`;
    const tracks = await fetchTrackListIfNeeded(record);
    if (!hasTrackList) {
      listEl.innerHTML = tracks
        ? tracks.map((t, i) => trackRowHtml(t, i)).join("")
        : `<li class="track-loading">Couldn't load tracks.</li>`;
    }
    // The same fetch above also computed record.totalDuration — the meta
    // row was rendered before this resolved (it's fetched lazily, on
    // open, not up front), so it needs updating here too now it's in.
    if (durationEl && record.totalDuration) {
      durationEl.textContent = record.totalDuration;
    }
  }

  function formatDuration(ms) {
    const mins = Math.floor(ms / 60000);
    const secs = Math.floor((ms % 60000) / 1000);
    return `${mins}:${secs.toString().padStart(2, "0")}`;
  }

  function formatAlbumDuration(ms) {
    // A whole-album total reads better as "42 min" or "1 hr 12 min" than
    // the track-level "M:SS" style formatDuration uses above.
    const totalMins = Math.round(ms / 60000);
    const hrs = Math.floor(totalMins / 60);
    const mins = totalMins % 60;
    if (hrs === 0) return `${mins} min`;
    return `${hrs} hr ${mins} min`;
  }

  function loadShelf() {
    try { return JSON.parse(localStorage.getItem("vinyl_shelf_records") || "[]"); }
    catch { return []; }
  }
  function saveShelf() {
    localStorage.setItem("vinyl_shelf_records", JSON.stringify(shelf));
  }

  // v120: no client secret any more (the hosted app is public, so a secret
  // in it would be exposed). Everything — search, new releases, track
  // lookups — uses the signed-in (PKCE) token instead; searching needs you
  // to have connected Spotify once.
  async function getAccessToken() {
    const t = await getUserAccessToken();
    if (!t) throw new Error("Not signed in to Spotify");
    return t;
  }

  // =====================================================================
  // In-page Spotify playback. This is entirely separate from the search
  // above (which only ever uses the app-only token and needs no login) —
  // playback needs a real user login, because Spotify has to know it's you
  // and that you're entitled to stream, via the Web Playback SDK.
  // =====================================================================

  const REDIRECT_URI = window.location.origin + window.location.pathname;
  const USER_SCOPES = "streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state user-follow-read user-follow-modify";
  const REFRESH_TOKEN_KEY = "vinyl_shelf_spotify_refresh_token";
  const GRANTED_SCOPE_KEY = "vinyl_shelf_spotify_scope"; // deliberately NOT in BACKUP_KEYS — it describes this browser's login, not your collection

  let userAccessToken = null;
  let userTokenExpires = 0;
  let spotifyPlayer = null;
  let spotifyDeviceId = null;

  // ---- No autoplay: when the record you started finishes, stop. ----
  // Spotify keeps playing "whatever it throws out there" after an album or
  // song ends. The Web Playback SDK has no setting for that, so the app
  // watches the player itself while one of its own records is playing:
  //  1. If the track that's playing is no longer one of ours (after we saw
  //     it playing ours), pause — whatever the context field says. (v111
  //     also trusted state.context.uri, but Spotify can keep the old context
  //     while it plays an unrelated track after the end, so a foreign track
  //     slipped through; only the track itself is trusted now.)
  //  2. Better, stop *before* it happens: when the playing track is the last
  //     one of ours (nothing of ours next in the queue) and it is within a
  //     fraction of a second of its end, pause and rewind it to 0:00, so
  //     there is no blip of the next song, and play/Space replays it.
  // The player only sends events on changes, not on a clock, so a short poll
  // reads its current state while a guard is active.
  let playbackGuard = null; // { albumUri } or { trackUri }, plus seen:true once ours was observed playing
  let playbackGuardTimer = null;
  const GUARD_POLL_MS = 150;
  const GUARD_ARM_MS = 1500;  // once the last track is this close to its end, schedule the stop precisely
  let guardLeadMs = 100;      // how early to fire the pause so it lands on the end; re-tuned from measured pause latency

  function stopPlaybackGuardPoll() { clearInterval(playbackGuardTimer); playbackGuardTimer = null; }
  function startPlaybackGuardPoll() {
    stopPlaybackGuardPoll();
    playbackGuardTimer = setInterval(async () => {
      if (!playbackGuard || !spotifyPlayer || !spotifyPlayer.getCurrentState) { stopPlaybackGuardPoll(); return; }
      try {
        const st = await spotifyPlayer.getCurrentState();
        if (st) stopIfAutoplayed(st);
      } catch (e) { /* transient — try again next tick */ }
    }, GUARD_POLL_MS);
  }

  function isOursTrack(t) {
    if (!t || !playbackGuard) return false;
    return playbackGuard.trackUri
      ? (t.uri === playbackGuard.trackUri || t.linked_from?.uri === playbackGuard.trackUri || t.linked_from?.id === playbackGuard.trackUri.split(":")[2])
      : t.album?.uri === playbackGuard.albumUri;
  }

  function haltAtEnd(rewind, onPaused) {
    try {
      const p = spotifyPlayer.pause();
      if (onPaused) Promise.resolve(p).then(onPaused).catch(() => {});
      if (rewind && spotifyPlayer.seek) Promise.resolve(p).then(() => spotifyPlayer.seek(0)).catch(() => {});
    } catch (e) { console.error(e); }
    isPlaying = false;
    updatePlayPauseIcon();
    updatePlayingSpineIndicator();
    syncIdleSearchDisplay();
  }

  function stopIfAutoplayed(state) {
    if (!playbackGuard) return false;
    const tw = state.track_window || {};
    const cur = tw.current_track;
    if (!cur) return false;
    if (isOursTrack(cur)) {
      playbackGuard.seen = true;
      // Last of ours, and about to end? Stop before Spotify moves on.
      const next = (tw.next_tracks || [])[0];
      const isLast = !next || !isOursTrack(next);
      const remaining = (state.duration || 0) - (state.position || 0);
      const justHalted = playbackGuard.haltedAt && Date.now() - playbackGuard.haltedAt < 1500; // the pause hasn't shown up in the state yet
      clearTimeout(playbackGuard.endTimer); // every fresh reading re-syncs the scheduled stop
      if (!state.paused && isLast && state.duration > 0 && !justHalted) {
        const g = playbackGuard;
        if (remaining <= guardLeadMs) { g.haltedAt = Date.now(); haltAtEnd(true); return true; }
        if (remaining <= GUARD_ARM_MS) {
          // One timer aimed at the end of the track (minus the time a pause
          // takes to land), instead of hoping a poll tick happens to fall
          // in the last fraction of a second.
          g.endTimer = setTimeout(() => {
            if (playbackGuard !== g) return;
            g.haltedAt = Date.now();
            const t0 = performance.now();
            haltAtEnd(true, () => { guardLeadMs = Math.max(60, Math.min(400, Math.round(performance.now() - t0) + 30)); });
          }, Math.max(0, remaining - guardLeadMs));
        }
      }
      return false;
    }
    if (!playbackGuard.seen) return false; // still loading our own request, not a runaway yet
    if (state.paused) return false;         // already stopped — leave it
    haltAtEnd(false);                       // it got past the end: stop, keep our record on display
    playbackGuard = null;                   // done guarding — anything you start next (even from your phone) is left alone
    stopPlaybackGuardPoll();
    return true;
  }
  let currentTrackName = "";
  let lastSdkTrack = null;
  let showingPlayback = shelf.length > 0; // an empty shelf opens on search (nothing to play yet); once there's a collection, playback controls are the more useful default

  const playbackControlsEl = document.getElementById("playback-controls");
  const connectPromptEl = document.getElementById("connect-prompt");

  function hasSpotifyLogin() {
    return !!localStorage.getItem(REFRESH_TOKEN_KEY);
  }
  function hasFollowModifyScope() {
    // Spotify fixes a login's permissions at the moment of login, so anyone
    // who connected before following existed needs to reconnect once.
    return (localStorage.getItem(GRANTED_SCOPE_KEY) || "").split(/\s+/).includes("user-follow-modify");
  }

  function pkceRandomString(length) {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    const values = crypto.getRandomValues(new Uint8Array(length));
    return Array.from(values, (v) => chars[v % chars.length]).join("");
  }

  async function pkceSha256Base64Url(input) {
    const data = new TextEncoder().encode(input);
    const digest = await crypto.subtle.digest("SHA-256", data);
    return btoa(String.fromCharCode(...new Uint8Array(digest)))
      .replace(/\+/g, "-")
      .replace(/\//g, "_")
      .replace(/=+$/, "");
  }

  async function beginUserLogin() {
    const verifier = pkceRandomString(64);
    sessionStorage.setItem("vinyl_shelf_pkce_verifier", verifier);
    const challenge = await pkceSha256Base64Url(verifier);
    const url = new URL("https://accounts.spotify.com/authorize");
    url.searchParams.set("client_id", SPOTIFY_CLIENT_ID);
    url.searchParams.set("response_type", "code");
    url.searchParams.set("redirect_uri", REDIRECT_URI);
    url.searchParams.set("scope", USER_SCOPES);
    url.searchParams.set("code_challenge_method", "S256");
    url.searchParams.set("code_challenge", challenge);
    window.location.href = url.toString();
  }

  async function handleOAuthRedirectIfPresent() {
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    if (!code) return;
    try {
      const verifier = sessionStorage.getItem("vinyl_shelf_pkce_verifier");
      const body = new URLSearchParams({
        client_id: SPOTIFY_CLIENT_ID,
        grant_type: "authorization_code",
        code,
        redirect_uri: REDIRECT_URI,
        code_verifier: verifier,
      });
      const res = await fetch("https://accounts.spotify.com/api/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body,
      });
      if (!res.ok) throw new Error("Spotify login exchange failed");
      const data = await res.json();
      userAccessToken = data.access_token;
      userTokenExpires = Date.now() + data.expires_in * 1000 - 5000;
      if (data.refresh_token) localStorage.setItem(REFRESH_TOKEN_KEY, data.refresh_token);
      if (data.scope) localStorage.setItem(GRANTED_SCOPE_KEY, data.scope);
    } catch (err) {
      console.error(err);
    } finally {
      window.history.replaceState({}, "", REDIRECT_URI); // scrub ?code= from the visible URL
    }
  }

  async function refreshUserToken() {
    const refreshToken = localStorage.getItem(REFRESH_TOKEN_KEY);
    if (!refreshToken) return null;
    try {
      const body = new URLSearchParams({
        client_id: SPOTIFY_CLIENT_ID,
        grant_type: "refresh_token",
        refresh_token: refreshToken,
      });
      const res = await fetch("https://accounts.spotify.com/api/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body,
      });
      if (!res.ok) throw new Error("Spotify token refresh failed");
      const data = await res.json();
      userAccessToken = data.access_token;
      userTokenExpires = Date.now() + data.expires_in * 1000 - 5000;
      if (data.refresh_token) localStorage.setItem(REFRESH_TOKEN_KEY, data.refresh_token);
      if (data.scope) localStorage.setItem(GRANTED_SCOPE_KEY, data.scope);
      return userAccessToken;
    } catch (err) {
      console.error(err);
      localStorage.removeItem(REFRESH_TOKEN_KEY); // stale/revoked — back to showing "connect"
      updateConnectPromptVisibility();
      return null;
    }
  }

  async function getUserAccessToken() {
    if (userAccessToken && Date.now() < userTokenExpires) return userAccessToken;
    return refreshUserToken();
  }

  function updateConnectPromptVisibility() {
    // Hidden once logged in, and also while the releases feed is showing
    // its own inline connect prompt for the same login — no need for both
    // at once.
    connectPromptEl.classList.toggle("hidden", hasSpotifyLogin() || showingReleases);
  }

  connectPromptEl.addEventListener("click", () => beginUserLogin());

  // =====================================================================
  // Follow / unfollow an artist from the hover card. The follow state
  // lives on Spotify, not here — it's looked up when a card opens and held
  // in memory only for this page load, never saved and never backed up.
  // Spotify's Feb 2026 API change replaced the old /me/following calls
  // with /me/library (artists passed as spotify:artist: URIs); the old
  // calls are kept as a fallback in case an app still has them.
  // =====================================================================

  const artistFollowState = new Map(); // artistId -> true/false, this page load only

  async function followApiRequest(method, artistId) {
    const token = await getUserAccessToken();
    if (!token) return { ok: false, status: 401 };
    const headers = { Authorization: `Bearer ${token}` };
    const uri = encodeURIComponent(`spotify:artist:${artistId}`);
    let res = await fetch(`https://api.spotify.com/v1/me/library?uris=${uri}`, { method, headers });
    if (!res.ok && [404, 405, 410].includes(res.status)) {
      res = await fetch(`https://api.spotify.com/v1/me/following?type=artist&ids=${artistId}`, { method, headers });
    }
    return res;
  }

  async function fetchIsFollowing(artistId) {
    const token = await getUserAccessToken();
    if (!token) return null;
    const headers = { Authorization: `Bearer ${token}` };
    const uri = encodeURIComponent(`spotify:artist:${artistId}`);
    let res = await fetch(`https://api.spotify.com/v1/me/library/contains?uris=${uri}`, { headers });
    if (!res.ok && [404, 405, 410].includes(res.status)) {
      res = await fetch(`https://api.spotify.com/v1/me/following/contains?type=artist&ids=${artistId}`, { headers });
    }
    if (!res.ok) return null;
    const data = await res.json();
    return Array.isArray(data) ? !!data[0] : null;
  }

  function paintFollowBtn(btn) {
    const id = btn.dataset.artistId;
    const known = id && artistFollowState.has(id);
    btn.hidden = !known;
    if (!known) return;
    const following = artistFollowState.get(id);
    const name = btn.dataset.artistName || "this artist";
    btn.classList.toggle("following", following);
    btn.setAttribute("aria-pressed", following ? "true" : "false");
    btn.title = following ? `Following ${name} — click to unfollow` : `Follow ${name}`;
  }
  function paintAllFollowBtns(artistId) {
    document.querySelectorAll(`.follow-btn[data-artist-id="${artistId}"]`).forEach(paintFollowBtn);
  }

  // How long a looked-up follow state is trusted before a card opening asks
  // Spotify again. Deliberately long: a follow/unfollow made elsewhere (say,
  // on your phone) doesn't need to appear instantly, and every fresh page
  // load already re-checks from scratch because this is held in memory only.
  // This just covers a tab left open for a long time. Per artist, not per
  // card, so several records by one artist are still a single request.
  const FOLLOW_STALE_MS = 30 * 60 * 1000;
  const artistFollowCheckedAt = new Map(); // artistId -> timestamp of last successful lookup
  const followChecksInFlight = new Map(); // artistId -> promise, so concurrent opens share one request
  const artistIdByName = new Map(); // lowercased name -> id, for the name-search fallback (memory only, never saved)

  function refreshFollowState(id) {
    if (followChecksInFlight.has(id)) return followChecksInFlight.get(id);
    const p = (async () => {
      try {
        const state = await fetchIsFollowing(id);
        if (state === null) return null;
        artistFollowState.set(id, state);
        artistFollowCheckedAt.set(id, Date.now());
        paintAllFollowBtns(id);
        return state;
      } catch (err) {
        console.error(err);
        return null;
      } finally {
        followChecksInFlight.delete(id);
      }
    })();
    followChecksInFlight.set(id, p);
    return p;
  }

  function findSiblingArtist(record) {
    // Another record by the same artist may already know the id — free, no request.
    for (const o of shelf) {
      if (o === record || !(o.artistIds && o.artistIds.length)) continue;
      if (o.artist === record.artist) return { ids: o.artistIds.slice(), names: (o.artistNames || []).slice() };
      const n0 = o.artistNames && o.artistNames[0];
      if (n0 && (record.artist === n0 || record.artist.startsWith(n0 + ", "))) return { ids: [o.artistIds[0]], names: [n0] };
    }
    return null;
  }

  async function searchArtistIdByName(name) {
    // Last resort, for a record whose album Spotify no longer returns (removed,
    // re-issued under a new id). Only trusted when exactly ONE artist has
    // exactly this name — following a namesake by mistake would change your
    // real account, so anything ambiguous is left alone.
    const key = name.toLowerCase();
    if (artistIdByName.has(key)) return artistIdByName.get(key);
    const token = await getAccessToken();
    const url = new URL("https://api.spotify.com/v1/search");
    url.searchParams.set("q", `artist:"${name}"`);
    url.searchParams.set("type", "artist");
    url.searchParams.set("limit", "10");
    const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
    if (!res.ok) return null;
    const data = await res.json();
    const exact = (data.artists?.items || []).filter((a) => a.name.toLowerCase() === key);
    const id = exact.length === 1 ? exact[0].id : null;
    if (id) artistIdByName.set(key, id);
    return id;
  }

  async function resolveArtistId(record) {
    if (record.artistIds && record.artistIds.length) return { id: record.artistIds[0], name: (record.artistNames && record.artistNames[0]) || record.artist };
    const sib = findSiblingArtist(record);
    if (sib) {
      record.artistIds = sib.ids; record.artistNames = sib.names; saveShelf();
      return { id: sib.ids[0], name: sib.names[0] || record.artist };
    }
    await fetchTrackListIfNeeded(record); // also backfills artistIds from the album
    if (record.artistIds && record.artistIds.length) return { id: record.artistIds[0], name: (record.artistNames && record.artistNames[0]) || record.artist };
    try {
      const id = await searchArtistIdByName(record.artist);
      if (id) return { id, name: record.artist };
    } catch (err) { console.error(err); }
    console.warn(`Follow icon: couldn't work out which Spotify artist "${record.artist}" is for "${record.name}" — icon left hidden.`);
    return null;
  }

  // Called each time a card opens.
  async function syncFollowButton(record, btn) {
    if (isOffline) {
      // Can't check or change follow state without Spotify; show the icon greyed if we already know the artist.
      const id = (record.artistIds || [])[0];
      if (!id || !hasSpotifyLogin()) { btn.hidden = true; return; }
      btn.hidden = false;
      btn.dataset.artistId = id;
      if (artistFollowState.has(id)) paintFollowBtn(btn);
      return;
    }
    if (!hasSpotifyLogin()) { btn.hidden = true; return; }
    const who = await resolveArtistId(record);
    if (!who) return;
    btn.dataset.artistId = who.id;
    btn.dataset.artistName = who.name;
    if (artistFollowState.has(who.id)) paintFollowBtn(btn); // show what we know straight away…
    const checkedAt = artistFollowCheckedAt.get(who.id) || 0;
    if (Date.now() - checkedAt > FOLLOW_STALE_MS) await refreshFollowState(who.id); // …then confirm it with Spotify if it's gone stale (30 min)
  }

  const unfollowPopoverEl = document.getElementById("unfollow-popover");
  const unfollowTextEl = document.getElementById("unfollow-text");
  const unfollowNoBtn = document.getElementById("unfollow-no");
  const unfollowYesBtn = document.getElementById("unfollow-yes");
  const followReconnectPopoverEl = document.getElementById("follow-reconnect-popover");
  let unfollowTarget = null; // { id, name }

  function placePopover(popEl, anchorEl) {
    const rect = anchorEl.getBoundingClientRect();
    popEl.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - 190)) + "px";
    popEl.style.top = (rect.bottom + 6) + "px";
    popEl.classList.add("open");
  }
  function closeFollowPopovers() {
    unfollowPopoverEl.classList.remove("open");
    followReconnectPopoverEl.classList.remove("open");
    unfollowTarget = null;
  }

  async function setFollowing(artistId, wantFollow, anchorEl) {
    const previous = artistFollowState.get(artistId);
    artistFollowState.set(artistId, wantFollow); // optimistic
    paintAllFollowBtns(artistId);
    let res;
    try { res = await followApiRequest(wantFollow ? "PUT" : "DELETE", artistId); }
    catch (err) { console.error(err); res = { ok: false, status: 0 }; }
    if (!res.ok) {
      artistFollowState.set(artistId, previous); // roll back — Spotify didn't take it
      paintAllFollowBtns(artistId);
      if (res.status === 403 && anchorEl) placePopover(followReconnectPopoverEl, anchorEl);
      else console.error("Follow request failed", res.status);
    } else {
      artistFollowCheckedAt.set(artistId, Date.now()); // our own change — no need to re-ask for a while
    }
  }

  function onFollowBtnClick(btn) {
    const id = btn.dataset.artistId;
    if (!id || !artistFollowState.has(id)) return;
    if (!hasFollowModifyScope()) { placePopover(followReconnectPopoverEl, btn); return; }
    if (artistFollowState.get(id)) {
      unfollowTarget = { id, name: btn.dataset.artistName || "this artist" };
      unfollowTextEl.textContent = `Unfollow ${unfollowTarget.name}?`;
      placePopover(unfollowPopoverEl, btn);
      unfollowNoBtn.focus(); // safe default
    } else {
      setFollowing(id, true, btn);
    }
  }

  unfollowNoBtn.addEventListener("click", closeFollowPopovers);
  unfollowYesBtn.addEventListener("click", () => {
    const target = unfollowTarget;
    closeFollowPopovers();
    if (target) setFollowing(target.id, false, null);
  });
  document.getElementById("follow-reconnect-cancel").addEventListener("click", closeFollowPopovers);
  document.getElementById("follow-reconnect-go").addEventListener("click", () => beginUserLogin());
  document.addEventListener("click", (e) => {
    if (!unfollowPopoverEl.contains(e.target) && !followReconnectPopoverEl.contains(e.target)) closeFollowPopovers();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeFollowPopovers(); });

  // =====================================================================
  // New releases feed — a chronological list of what your followed
